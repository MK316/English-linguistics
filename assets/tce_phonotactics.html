<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCE Phonotactics Mock Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef;
    --paper: #ffffff;
    --ink: #1b1b1b;
    --muted: #5d5a54;
    --rule: #2b2b2b;
    --line: #d9d4ca;
    --accent: #1f4e8c;
    --accent-ink: #ffffff;
    --soft: #eef2f8;
    --ok: #1d7a46;
    --ok-bg: #e7f5ec;
    --bad: #b3261e;
    --bad-bg: #fbeceb;
    --blank-bg: #fbf7e8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515;
      --paper: #1f1f1f;
      --ink: #ececec;
      --muted: #a7a39b;
      --rule: #cfcfcf;
      --line: #3a3a3a;
      --accent: #7fa8e6;
      --accent-ink: #0e1a2b;
      --soft: #22293a;
      --ok: #6fd39a;
      --ok-bg: #16301f;
      --bad: #f2928b;
      --bad-bg: #3a1c1a;
      --blank-bg: #2c2817;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --rule: #cfcfcf; --line: #3a3a3a;
    --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a; --ok: #6fd39a; --ok-bg: #16301f;
    --bad: #f2928b; --bad-bg: #3a1c1a; --blank-bg: #2c2817;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Serif", "Times New Roman", serif; font-size: 17px; line-height: 1.65;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  h1 {
    font-family: "Noto Sans", system-ui, sans-serif; font-weight: 600; font-size: 1.35rem;
    margin: 0 0 4px; letter-spacing: -0.01em;
  }
  .sub { font-family: "Noto Sans", system-ui, sans-serif; color: var(--muted); font-size: 0.9rem; margin: 0; }
  .picker {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 18px 0 0;
    font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.95rem;
  }
  .picker label { color: var(--muted); }
  select {
    font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; min-width: 0; flex: 1 1 260px; max-width: 100%;
  }
  .nav { display: flex; gap: 6px; }
  .nav button { padding: 8px 12px; }

  .paper {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 24px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qhead { margin: 0 0 18px; font-size: 1.05rem; }
  .qnum { font-weight: 700; font-size: 1.35rem; margin-right: 6px; }

  .box {
    position: relative; border: 1px solid var(--rule); padding: 22px 18px 14px; margin: 22px 0 18px;
  }
  .box-label {
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -55%);
    background: var(--paper); padding: 0 10px; font-size: 0.95rem; white-space: nowrap;
  }
  .box p { margin: 0 0 10px; }
  .box p:last-child { margin-bottom: 0; }
  .indent { text-indent: 1em; }
  .data { padding-left: 2.1em; text-indent: -2.1em; }
  .data .tag { display: inline-block; width: 2.1em; text-indent: 0; }
  .data-sub { padding-left: 2.1em; }
  .cf { padding-left: 2.1em; color: var(--ink); }
  .blank {
    display: inline-block; min-width: 4.5em; border-bottom: 1px solid var(--ink); text-align: center;
    line-height: 1.2; padding: 0 4px;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }

  .directions { margin: 6px 0 0; }
  .step {
    margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line);
  }
  .step-title {
    font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.8rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px;
  }
  .choice-row {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 4px;
    font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.92rem;
  }
  .chip {
    font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; min-width: 44px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .field-label { display: block; font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.9rem; color: var(--muted); margin: 14px 0 6px; }
  textarea {
    width: 100%; min-height: 92px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea:focus, input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .passage-inputs { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 12px; font-size: 0.95rem; }

  .frame {
    margin: 12px 0 0; padding: 14px 16px; background: var(--soft); border-radius: 8px; line-height: 2.1;
  }
  .frame input, .passage-inputs input {
    font: inherit; color: var(--ink); background: var(--blank-bg); border: none;
    border-bottom: 1.5px solid var(--ink); border-radius: 0; padding: 0 6px; width: 9.5em; max-width: 100%;
    text-align: center;
  }
  .num { font-size: 0.9em; margin-right: 2px; }

  button.btn {
    font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.95rem; font-weight: 600;
    border-radius: 8px; padding: 10px 16px; cursor: pointer; border: 1px solid var(--accent);
    background: var(--paper); color: var(--accent);
  }
  button.btn.primary { background: var(--accent); color: var(--accent-ink); }
  button.btn:disabled { opacity: 0.5; cursor: default; }
  .nav button { font-family: "Noto Sans", system-ui, sans-serif; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

  .feedback-bar { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; }
  .feedback { margin-top: 18px; font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.95rem; }
  .fb-section { margin: 0 0 18px; }
  .fb-section h3 { font-size: 0.95rem; margin: 0 0 8px; }
  .fb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; }
  .fb-row.ok { background: var(--ok-bg); }
  .fb-row.bad { background: var(--bad-bg); }
  .verdict { font-weight: 600; }
  .ok .verdict { color: var(--ok); }
  .bad .verdict { color: var(--bad); }
  .mine { font-family: "Noto Serif", serif; background: var(--soft); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }
  .examples { margin: 0; padding-left: 1.4em; font-family: "Noto Serif", serif; }
  .examples li { margin-bottom: 4px; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    .paper { padding: 22px 14px 18px; }
    body { font-size: 16px; }
  }
</style>

const CIRC = { "1": "①", "2": "②", "3": "③" };
const state = {};

function getState(key) {
  if (!state[key]) state[key] = { choice: [], own: "", blanks: {}, step2: false, feedback: false };
  return state[key];
}

function dataHTML(tag, d) {
  if (!d) return "";
  let h = "";
  if (d.intro) {
    h += `<p class="data"><span class="tag">${tag}</span>${d.intro}</p>`;
    h += `<p class="data-sub">${d.forms}</p>`;
  } else {
    h += `<p class="data"><span class="tag">${tag}</span>${d.forms}</p>`;
  }
  if (d.cf) h += `<p class="cf">cf. ${d.cf}</p>`;
  return h;
}

function frameHTML(item, st) {
  return item.frame.replace(/\{(\d)\}/g, (_, n) =>
    `<span class="num">${CIRC[n]}</span><input type="text" data-blank="${n}" aria-label="Blank ${CIRC[n]}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escAttr(st.blanks[n] || "")}">`);
}

function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function escText(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render() {
  const idx = Number(document.getElementById("qselect").value);
  const item = ITEMS[idx];
  const st = getState(item.key);
  const hasB = !!item.box;
  const paper = document.getElementById("paper");

  let h = `<p class="qhead"><span class="qnum">${item.label}.</span>Read &lt;A&gt;${hasB ? " and &lt;B&gt;" : ""} and follow the directions.</p>`;

  h += `<section class="box" aria-label="Passage A"><span class="box-label">&lt;A&gt;</span>`;
  h += `<p class="indent">${item.background}</p>`;
  h += dataHTML("(1)", item.data1);
  h += dataHTML("(2)", item.data2);
  h += `</section>`;

  if (hasB) {
    h += `<section class="box" aria-label="Box B"><span class="box-label">&lt;B&gt;</span><div class="options">`;
    item.box.forEach(o => { h += `<div>${o.label}. ${o.form}</div>`; });
    h += `</div></section>`;
  }

  // Step 1
  h += `<div class="directions">`;
  h += `<p class="step-title">Step 1 · Your own generalization</p>`;
  h += `<p>${item.step1}</p>`;
  if (hasB) {
    const what = item.boxTask === "low" ? "low-rated" : "possible";
    h += `<div class="choice-row" role="group" aria-label="Choose two words in B"><span>Your choice (two ${what} words):</span>`;
    item.box.forEach(o => {
      const on = st.choice.includes(o.label);
      h += `<button type="button" class="chip" data-choice="${o.label}" aria-pressed="${on}">${o.label}</button>`;
    });
    h += `</div>`;
  }
  if (item.passageBlanks.length) {
    h += `<div class="passage-inputs">`;
    item.passageBlanks.forEach(n => {
      h += `<label>${CIRC[n]} (in &lt;A&gt;) <input type="text" data-blank="${n}" aria-label="Blank ${CIRC[n]} in A" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escAttr(st.blanks[n] || "")}"></label>`;
    });
    h += `</div>`;
  }
  h += `<label class="field-label" for="own">Write your generalization in one concise English sentence.</label>`;
  h += `<textarea id="own" placeholder="e.g., In English, ...">${escText(st.own)}</textarea>`;

  // Step 2
  h += `<div class="actions"><button type="button" class="btn" id="toStep2" ${st.step2 ? "hidden" : ""}>Try the frame sentence</button></div>`;
  h += `<div class="step" id="step2" ${st.step2 ? "" : "hidden"}>`;
  h += `<p class="step-title">Step 2 · Complete the frame sentence</p>`;
  h += `<p>${item.step2}</p>`;
  h += `<div class="frame">${frameHTML(item, st)}</div>`;
  h += `</div>`;
  h += `</div>`;

  // Feedback
  h += `<div class="feedback-bar"><button type="button" class="btn primary" id="check">Check my answers</button>`;
  h += `<button type="button" class="btn" id="reset">Reset this question</button></div>`;
  h += `<div class="feedback" id="feedback" ${st.feedback ? "" : "hidden"}></div>`;

  paper.innerHTML = h;
  bind(item, st);
  if (st.feedback) showFeedback(item, st);
  updateNav(idx);
}

function bind(item, st) {
  const paper = document.getElementById("paper");
  paper.querySelectorAll("[data-choice]").forEach(btn => {
    btn.addEventListener("click", () => {
      const v = btn.dataset.choice;
      if (st.choice.includes(v)) st.choice = st.choice.filter(x => x !== v);
      else {
        if (st.choice.length >= 2) st.choice.shift();
        st.choice.push(v);
      }
      paper.querySelectorAll("[data-choice]").forEach(b => b.setAttribute("aria-pressed", st.choice.includes(b.dataset.choice)));
    });
  });
  paper.querySelectorAll("input[data-blank]").forEach(inp => {
    inp.addEventListener("input", () => { st.blanks[inp.dataset.blank] = inp.value; });
  });
  document.getElementById("own").addEventListener("input", e => { st.own = e.target.value; });
  document.getElementById("toStep2").addEventListener("click", () => {
    st.step2 = true;
    document.getElementById("step2").hidden = false;
    document.getElementById("toStep2").hidden = true;
    const first = document.querySelector("#step2 input");
    if (first) first.focus();
  });
  document.getElementById("check").addEventListener("click", () => {
    st.feedback = true;
    if (!st.step2) {
      st.step2 = true;
      document.getElementById("step2").hidden = false;
      document.getElementById("toStep2").hidden = true;
    }
    showFeedback(item, st);
    document.getElementById("feedback").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("reset").addEventListener("click", () => {
    delete state[item.key];
    render();
  });
}

function norm(s) {
  return String(s || "").toLowerCase().replace(/[\s.,;:!?'"()]+/g, " ").trim();
}

function gradeBlanks(item, st) {
  const result = {};
  const used = new Set();
  const groups = item.unordered || [];
  const inGroup = n => groups.find(g => g.includes(n));
  Object.keys(item.answers).forEach(n => {
    const given = norm(st.blanks[n]);
    const accepted = item.answers[n].map(norm);
    let ok = given !== "" && accepted.includes(given);
    if (ok && inGroup(n)) {
      if (used.has(given)) ok = false; else used.add(given);
    }
    result[n] = { given: st.blanks[n] || "", ok, expected: item.answers[n] };
  });
  return result;
}

function expectedText(item, n) {
  const g = (item.unordered || []).find(g => g.includes(n));
  if (g) {
    const all = [...new Set(g.flatMap(k => item.answers[k]))];
    return all.join(" / ") + " (in either order)";
  }
  return item.answers[n].join(" or ");
}

function showFeedback(item, st) {
  const fb = document.getElementById("feedback");
  let h = "";

  if (item.box) {
    const want = [...item.boxAnswer].sort().join(", ");
    const got = [...st.choice].sort().join(", ");
    const ok = got === want;
    const what = item.boxTask === "low" ? "low-rated" : "possible";
    h += `<div class="fb-section"><h3>Box &lt;B&gt;</h3>`;
    h += `<div class="fb-row ${ok ? "ok" : "bad"}"><span class="verdict">${ok ? "Correct" : (got ? "Not quite" : "No choice made")}</span>`;
    h += `<span>Your choice: ${got || "—"}</span><span class="muted">The ${what} words are ${want}.</span></div></div>`;
  }

  const g = gradeBlanks(item, st);
  h += `<div class="fb-section"><h3>Blanks</h3>`;
  Object.keys(item.answers).forEach(n => {
    const r = g[n];
    const verdict = r.ok ? "Correct" : (r.given.trim() ? "Incorrect" : "Not answered");
    h += `<div class="fb-row ${r.ok ? "ok" : "bad"}"><span class="verdict">${CIRC[n]} ${verdict}</span>`;
    h += `<span>Your answer: ${r.given.trim() ? escText(r.given) : "—"}</span>`;
    if (!r.ok) h += `<span class="muted">Answer: ${expectedText(item, n)}</span>`;
    h += `</div>`;
  });
  h += `</div>`;

  if (st.own.trim()) {
    h += `<div class="fb-section"><h3>Your generalization</h3><div class="mine">${escText(st.own.trim())}</div>`;
    h += `<p class="muted">Compare it with the sample sentences below. A good answer names the sound class and the position or property involved.</p></div>`;
  }

  h += `<div class="fb-section"><h3>Sample generalizations</h3><ol class="examples">`;
  item.examples.forEach(e => { h += `<li>${escText(e)}</li>`; });
  h += `</ol></div>`;

  fb.innerHTML = h;
  fb.hidden = false;
}

function updateNav(idx) {
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === ITEMS.length - 1;
}

(function init() {
  const sel = document.getElementById("qselect");
  ITEMS.forEach((it, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `Question ${it.label} — ${it.short}`;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { render(); window.scrollTo({ top: 0 }); });
  document.getElementById("prev").addEventListener("click", () => { sel.value = Math.max(0, Number(sel.value) - 1); render(); });
  document.getElementById("next").addEventListener("click", () => { sel.value = Math.min(ITEMS.length - 1, Number(sel.value) + 1); render(); });
  render();
})();
</script>
