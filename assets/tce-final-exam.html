<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCE Final exam</title>
<style>
  :root {
    --ink: #1f2328; --muted: #59636e; --line: #d0d7de; --soft: #f6f8fa;
    --accent: #1f6f5c; --accent-soft: #e8f3ef; --warn: #9a3412;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 8px 4px 40px; color: var(--ink);
    font: 16px/1.65 "Source Sans 3", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
           border-bottom: 2px solid var(--ink); padding-bottom: 10px; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 14px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button { font: inherit; font-size: 15px; }
  select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  button:hover { background: var(--soft); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .45; cursor: default; }
  .total { font-size: 14px; color: var(--muted); }
  .total b { color: var(--ink); }

  h2.q { font-size: 17px; margin: 0 0 12px; }
  .box { border: 1px solid var(--ink); padding: 12px 16px; margin: 0 0 14px; }
  .box > .tag { font-weight: 700; margin-bottom: 6px; }
  .box p { margin: 6px 0; }
  .ex { margin: 8px 0 4px; }
  table.d { border-collapse: collapse; margin: 6px 0 10px 18px; }
  table.d th, table.d td { padding: 2px 18px 2px 0; text-align: left; vertical-align: top; }
  table.d th { font-weight: 600; border-bottom: 1px solid var(--line); }
  table.feat td, table.feat th { padding: 2px 12px; text-align: center; border: 1px solid var(--line); }
  table.feat td:first-child { text-align: left; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 2px 18px; }
  .indent { margin-left: 22px; }
  .blank { display: inline-block; min-width: 90px; border-bottom: 1px solid var(--ink); }
  .u { text-decoration: underline; }
  .note { font-size: 14px; }
  .dir { margin: 4px 0 14px; }

  textarea { width: 100%; min-height: 120px; padding: 10px; font: inherit; font-size: 15px;
             border: 1px solid var(--line); border-radius: 6px; resize: vertical; }
  .row { display: flex; gap: 8px; margin: 10px 0 18px; flex-wrap: wrap; }

  .fb { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 6px 6px 0; }
  .fb h3 { font-size: 15px; margin: 14px 0 6px; }
  .fb h3:first-child { margin-top: 0; }
  .fb .model { background: #fff; border: 1px solid var(--line); padding: 8px 12px; border-radius: 6px; }
  .rub { width: 100%; border-collapse: collapse; background: #fff; }
  .rub td, .rub th { border: 1px solid var(--line); padding: 6px 8px; font-size: 15px; vertical-align: top; }
  .rub th { background: var(--soft); text-align: left; }
  .rub td.pt { width: 64px; text-align: center; white-space: nowrap; }
  .rub label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .rub input { margin-top: 5px; }
  .score { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .fb ul { margin: 4px 0; padding-left: 20px; }
  .fb li { margin: 4px 0; }
  .hidden { display: none; }

  /* 선택지 */
  .opt { display: flex; gap: 6px; align-items: flex-start; padding: 3px 8px; margin: 2px 0;
         border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
  .opt:hover { background: var(--soft); }
  .opt input { margin: 6px 2px 0 0; accent-color: var(--accent); }
  .opt .ol { min-width: 1.2em; }
  .opt:has(input:checked) { background: var(--accent-soft); border-color: #b9d9cd; }
  .opt .sit { color: var(--muted); }
  .opt.ok   { background: #e6f4ea; border-color: #34a853; }
  .opt.ng   { background: #fdecea; border-color: #d93025; }
  .opt.miss { border: 1px dashed #34a853; }
  .opt.ok::after   { content: "✓"; color: #188038; margin-left: auto; font-weight: 700; }
  .opt.ng::after   { content: "✗"; color: #d93025; margin-left: auto; font-weight: 700; }
  .opt.miss::after { content: "정답"; color: #188038; margin-left: auto; font-size: 13px; }
  .pickinfo { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
  .pickinfo.over { color: var(--warn); font-weight: 600; }

  /* 빈칸 */
  .bl { font: inherit; font-size: 15px; padding: 1px 6px; border: none; border-bottom: 2px solid var(--ink);
        background: #fffbea; outline: none; text-align: center; }
  .bl:focus { border-bottom-color: var(--accent); background: #fff; }
  .bl.ok { border-bottom-color: #34a853; background: #e6f4ea; }
  .bl.ng { border-bottom-color: #d93025; background: #fdecea; }
  .blkey { font-size: 13px; margin-left: 4px; color: #188038; }
  .blkey.ng { color: #d93025; }
  .wlabel { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Final exam</h1>
      <div class="sub">English Linguistics (Fall 2026) · 10 items · Total 38 points</div>
    </div>
    <div class="controls">
      <button id="prev" aria-label="이전 문항">◀</button>
      <select id="pick" aria-label="문항 선택"></select>
      <button id="next" aria-label="다음 문항">▶</button>
      <span class="total">자기 채점 <b id="tot">0</b> / 38</span>
    </div>
  </header>

  <main id="item"></main>

  <div class="row">
    <button class="primary" id="toggle">정답 · 해설 보기</button>
    <button id="clear">답안 지우기</button>
  </div>
  <section id="fb" class="fb hidden"></section>
</div>

<script>
/* ---------- helpers ---------- */
const T = (head, rows, cls = "d") =>
  `<table class="${cls}">${head ? "<tr>" + head.map(h => `<th>${h}</th>`).join("") + "</tr>" : ""}` +
  rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</table>";
const box = (tag, html) => `<div class="box"><div class="tag">&lt;${tag}&gt;</div>${html}</div>`;
// 선택지: 클릭해서 고르는 체크박스
const OPT = (l, html) => `<label class="opt" data-opt="${l}"><input type="checkbox" value="${l}"><span class="ol">${l}.</span><span>${html}</span></label>`;
// 빈칸: 직접 입력하는 칸 (k = 문항 안에서 몇 번째 빈칸인지)
const BL = (k, w = 110) => `<span class="blwrap"><input class="bl" data-blank="${k}" style="width:${w}px" autocomplete="off" spellcheck="false" aria-label="빈칸 ${k + 1}"><span class="blkey" data-key="${k}"></span></span>`;

/* ---------- items ---------- */
const ITEMS = [
{
  no: "1", pts: 4, title: "Cluster simplification",
  A: `<p>In connected speech, a word that ends in a consonant cluster often loses the final member of the cluster. This process, known as cluster simplification, is shown in (1).</p>
  <div class="ex">(1)</div>
  ${T(["Phrase", "Pronunciation"], [["bold move","[boʊl muv]"],["mist formed","[mɪs fɔrmd]"],["soft cheese","[sɔf tʃiz]"],["cold meal","[koʊl mil]"]])}
  <p>The phrases in (2) show that the cluster stays intact when the next word begins with a vowel.</p>
  <div class="ex">(2)</div>
  ${T(["Phrase","Attested","Unattested"], [["bold idea","[boʊld aɪdiə]","*[boʊl aɪdiə]"],["mist arose","[mɪst əroʊz]","*[mɪs əroʊz]"],["soft ice","[sɔft aɪs]","*[sɔf aɪs]"],["cold air","[koʊld ɛr]","*[koʊl ɛr]"]])}
  <p>It may thus appear that the final consonant is deleted whenever the next word begins with a consonant. The phrases in (3), however, show that this is not always the case.</p>
  <div class="ex">(3)</div>
  ${T(["","Phrase","Attested","Unattested"], [
    ["a.","cold heart","[koʊld hɑrt]","*[koʊl hɑrt]"],["","guest house","[gɛst haʊs]","*[gɛs haʊs]"],
    ["","left hand","[lɛft hænd]","*[lɛf hænd]"],["","wild horse","[waɪld hɔrs]","*[waɪl hɔrs]"],
    ["b.","bowled twice","[boʊld twaɪs]","*[boʊl twaɪs]"],["","missed calls","[mɪst kɔlz]","*[mɪs kɔlz]"],
    ["","stuffed toys","[stʌft tɔɪz]","*[stʌf tɔɪz]"],["","called back","[kɔld bæk]","*[kɔl bæk]"]])}
  <p class="note"><i>Note</i>: '*' indicates unattested pronunciations.</p>`,
  B: `<div class="opts">${OPT("a","fast horse")}${OPT("b","past midnight")}${OPT("c","passed notes")}${OPT("d","gold coin")}${OPT("e","kind host")}${OPT("f","best answers")}</div>`,
  dir: `In &lt;B&gt;, choose the TWO phrases in which the final consonant of the first word can be deleted as described in &lt;A&gt;. Then, based on the data in (3), state the TWO conditions under which a word-final cluster is NOT simplified even though the next word begins with a consonant.`,
  key: "b, d",
  model: `The two phrases are b and d. First, the final consonant of the cluster is not deleted when the next word begins with /h/, as in (3a). Second, it is not deleted when it is a grammatical ending, that is, the suffix <i>-ed</i>, so that the cluster does not belong to a single morpheme, as in (3b).`,
  rubric: [["b 선택",1,"o:b"],["d 선택",1,"o:d"],["조건 1: 뒤 단어가 /h/로 시작함 (3a)",1],["조건 2: 자음군의 마지막 자음이 문법 어미 <i>-ed</i>임, 즉 자음군이 한 형태소 안에 있지 않음 (3b)",1]],
  notes: [
    "(1)과 (2)를 비교하면 어말 자음군의 마지막 자음은 뒤 단어가 자음으로 시작할 때 탈락한다. 그런데 (3a)는 뒤 자음이 /h/일 때, (3b)는 마지막 자음이 과거·과거분사 어미 <i>-ed</i>일 때 탈락하지 않음을 보여 준다. <i>bold/bowled</i>, <i>mist/missed</i>는 발음이 같아도 형태소 구조가 달라 결과가 다르다.",
    "b <i>past midnight</i> [pæs mɪdnaɪt], d <i>gold coin</i> [goʊl kɔɪn]: 첫 단어가 단일 형태소이고 뒤 단어가 /h/가 아닌 자음으로 시작하므로 탈락한다.",
    "a <i>fast horse</i>, e <i>kind host</i>: 뒤 단어가 /h/로 시작한다. c <i>passed notes</i>: /t/가 어미 <i>-ed</i>이다. f <i>best answers</i>: 뒤 단어가 모음으로 시작한다.",
    "조건 2는 \"past tense suffix\", \"inflectional ending\" 등으로 써도 인정한다."]
},
{
  no: "2", pts: 5, title: "Ambisyllabicity",
  A: `<p>When a single consonant occurs between two vowels, spoken syllabification assigns it to the onset of the following syllable. The words in (1) are divided in this way, and native speakers readily accept the divisions.</p>
  <div class="ex">(1)</div>
  ${T(["","Word","Syllabification"], [["a.","rival","[ˈraɪ.vəl]"],["","legal","[ˈli.gəl]"],["","paper","[ˈpeɪ.pər]"],["","moment","[ˈmoʊ.mənt]"],["b.","balloon","[bə.ˈlun]"],["","police","[pə.ˈlis]"],["","canal","[kə.ˈnæl]"],["","machine","[mə.ˈʃin]"]])}
  <p>With the words in (2), however, many speakers are not comfortable with the same kind of division. They feel that the consonant between the two vowels closes the first syllable and, at the same time, begins the second one. A consonant that belongs to two syllables at once in this way is said to be ${BL(0,150)}.</p>
  <div class="ex">(2)</div>
  ${T(["Word","Pronunciation","Word","Pronunciation"], [["happen","[ˈhæpən]","punish","[ˈpʌnɪʃ]"],["finish","[ˈfɪnɪʃ]","woman","[ˈwʊmən]"],["lemon","[ˈlɛmən]","cabin","[ˈkæbɪn]"]])}
  <p>A comparison of (1) and (2) shows that whether a consonant behaves in this way depends on the vowel that immediately precedes it.</p>`,
  B: `<div class="opts">${OPT("a","vanish [ˈvænɪʃ]")}${OPT("b","bonus [ˈboʊnəs]")}${OPT("c","guitar [gɪˈtɑr]")}${OPT("d","honey [ˈhʌni]")}</div>`,
  dir: `Fill in the blank in &lt;A&gt; with the ONE most appropriate word. Then, identify the TWO words in &lt;B&gt; in which the consonant between the two vowels belongs to both syllables at once, and state the TWO phonological conditions that the vowel immediately before such a consonant must satisfy.`,
  key: "빈칸: ambisyllabic / 〈B〉: a, d",
  model: `The word for the blank is "ambisyllabic." The two words are a (<i>vanish</i>) and d (<i>honey</i>). For the consonant to belong to both syllables, the vowel immediately before it must be a short (lax) vowel, and it must be stressed.`,
  rubric: [["빈칸: ambisyllabic",1,"b:0"],["a 선택",1,"o:a"],["d 선택",1,"o:d"],["조건 1: 앞 모음이 단모음(short/lax vowel)임",1],["조건 2: 앞 모음이 강세를 받음",1]],
  notes: [
    "(1a)는 앞 모음이 강세를 받지만 장모음·이중모음이고, (1b)는 앞 모음이 단모음이지만 강세가 없다. 두 경우 모두 자음은 뒤 음절의 두음일 뿐이다. (2)는 모두 강세를 받는 단모음 뒤이므로 두 조건이 함께 충족되어야 한다.",
    "a <i>vanish</i> [ˈvænɪʃ], d <i>honey</i> [ˈhʌni]: 강세를 받는 단모음 [æ], [ʌ] 뒤의 /n/이 양음절 자음이다.",
    "b <i>bonus</i>: 강세 모음이 이중모음 [oʊ]이다. c <i>guitar</i>: /t/ 앞의 [ɪ]는 단모음이지만 강세가 없다.",
    "영어의 강세 음절은 heavy여야 하므로, 단모음 뒤의 자음이 앞 음절의 말음 역할도 함께 한다는 것이 이 현상의 이유이다(채점 요소는 아님)."]
},
{
  no: "3-1", pts: 2, title: "The comparative suffix -er",
  A: `<p>Distinctive features of speech sounds play an important role in many morphological processes in English. One such process is the formation of comparatives with the suffix <i>‑er</i>. The suffix freely attaches to monosyllabic adjectives, but its attachment to disyllabic adjectives is restricted. Consider the following <i>‑er</i> suffixed words.</p>
  <div class="ex">(1)</div>
  ${T(null, [["happier","simpler","narrower"],["cleverer","gentler","yellower"],["commoner","noisier","shallower"]])}
  <p>All the adjective stems in (1) are disyllabic, with stress on the first syllable. Disyllabic adjectives with the same stress pattern, however, sometimes fail to take the suffix <i>‑er</i>, as illustrated in (2). They must instead form their comparatives with <i>more</i> (e.g., <i>more rapid</i>).</p>
  <div class="ex">(2)</div>
  ${T(null, [["*rapider","*solider","*vivider"],["*timider","*frequenter","*nervouser"]])}
  <p>Since stress cannot account for the contrast between (1) and (2), we need another phonological property that refers to one of the distinctive features for vowels and consonants in English. The table in (3) provides some of the well-known distinctive features for the segments that the adjective stems in (1) and (2) end in.</p>
  <div class="ex">(3)</div>
  ${T(["","vowel","glide","liquid","nasal","obstruent"], [
    ["[consonantal]","−","−","+","+","+"],["[continuant]","+","+","+","−","+/−"],
    ["[syllabic]","+","−","+/−","+/−","−"],["[sonorant]","+","+","+","+","−"]], "d feat")}
  <p class="note"><i>Note</i>: '*' indicates an unattested word.</p>`,
  B: `<p>What differentiates the words in (1) from those in (2) is that the comparative suffix <i>‑er</i> can attach to disyllabic adjectives only when they end in a segment with the feature [ ${BL(0,120)} ].</p>`,
  dir: `Fill in the blank in &lt;B&gt; with the ONE distinctive feature from the passage in &lt;A&gt;. The feature value (i.e., '+' or '−') must be specified.`,
  key: "[+sonorant]",
  model: `The feature is [+sonorant].`,
  rubric: [["[+sonorant]: 자질 이름과 값(+)을 모두 정확히 씀 (값 누락 시 0점)",2,"b:0"]],
  notes: [
    "(1)의 어간은 모음(<i>happy</i>, <i>noisy</i>), 활음(<i>narrow</i>, <i>yellow</i>, <i>shallow</i>의 [oʊ] 끝 off-glide), 유음(<i>simple</i>, <i>gentle</i>, <i>clever</i>), 비음(<i>common</i>)으로 끝나 모두 [+sonorant]이다. (2)의 어간은 모두 장애음 /d, t, s/로 끝나 [−sonorant]이다.",
    "[−consonantal]: 유음·비음으로 끝나는 <i>simple</i>, <i>clever</i>, <i>common</i>을 설명하지 못한다. [+continuant]: 비음으로 끝나는 <i>common</i>(−cont)을 설명하지 못하고, (2)의 <i>nervous</i>(/s/, +cont)를 걸러내지 못한다. [+syllabic]: 활음으로 끝나는 <i>narrow</i> 등(−syllabic)을 설명하지 못한다.",
    "지문에서 (1)과 (2)의 강세 패턴(첫 음절 강세 2음절)을 통제해 강세로는 설명할 수 없음을 밝혔다. -en 동사화(정답 [−sonorant]) 기출과 반대 값이 정답이 되도록 설계했다."]
},
{
  no: "4", pts: 4, title: "Stress and the suffix -al",
  A: `<p>Suffixes differ in how they affect the stress of the word they attach to. A stress-neutral suffix such as <i>-ness</i> or <i>-ful</i> never changes the location of the primary stress, as in <i>happy</i> [ˈhæpi] – <i>happiness</i> [ˈhæpinəs]. The adjective-forming suffix <i>-al</i> does not behave in this way. In the adjectives in (1), the primary stress falls on the syllable immediately before the suffix.</p>
  <div class="ex">(1)</div>
  ${T(["Base","Adjective"], [["parent [ˈpɛrənt]","parental [pəˈrɛntəl]"],["accident [ˈæksədənt]","accidental [ˌæksəˈdɛntəl]"],["autumn [ˈɔtəm]","autumnal [ɔˈtʌmnəl]"],["archetype [ˈɑrkətaɪp]","archetypal [ˌɑrkəˈtaɪpəl]"]])}
  <p>In the adjectives in (2), however, the primary stress does not fall on that syllable.</p>
  <div class="ex">(2)</div>
  ${T(["Base","Adjective"], [["person [ˈpɜrsən]","personal [ˈpɜrsənəl]"],["season [ˈsizən]","seasonal [ˈsizənəl]"],["origin [ˈɔrədʒən]","original [əˈrɪdʒənəl]"],["medicine [ˈmɛdəsən]","medicinal [məˈdɪsənəl]"]])}
  <p>As (1) and (2) show, the location of the primary stress depends on the structure of the syllable immediately before the suffix.</p>`,
  B: `${OPT("a","hormone [ˈhɔrmoʊn] → hormonal")}${OPT("b","pivot [ˈpɪvət] → pivotal")}${OPT("c","dialect [ˈdaɪəlɛkt] → dialectal")}${OPT("d","margin [ˈmɑrdʒən] → marginal")}`,
  dir: `Based on &lt;A&gt;, choose the TWO words in &lt;B&gt; whose adjective form has the primary stress on the syllable immediately before <i>-al</i>. Then, state the generalization about where the primary stress falls in <i>-al</i> adjectives, referring to the structure of that syllable.`,
  key: "a, c",
  model: `The two words are a (<i>hormonal</i>) and c (<i>dialectal</i>). If the syllable immediately before <i>-al</i> is heavy, that is, if it has a long vowel or a diphthong or is closed by a consonant, the primary stress falls on that syllable. If it is light, that is, an open syllable with a short vowel, the primary stress falls one syllable further to the left.`,
  rubric: [["a 선택",1,"o:a"],["c 선택",1,"o:c"],["접미사 바로 앞 음절이 heavy(장모음·이중모음 또는 폐음절)이면 그 음절에 주강세",1],["그 음절이 light(단모음 개음절)이면 한 음절 더 왼쪽에 주강세",1]],
  notes: [

  no: "7", pts: 2, title: "Falling and rising contours",
  A: `<p>Intonation is the variation of pitch over a phrase or sentence. The stretch of speech over which one intonation contour extends is called a tone group. As (1)–(4) show, the same sentence may end in a falling or a rising contour, depending on the situation in which it is said.</p>

  const it = ITEMS[cur], auto = AUTO[it.no];
  pick.value = cur;
  $("prev").disabled = cur === 0;
  $("next").disabled = cur === ITEMS.length - 1;

  itemEl.innerHTML = `
    <h2 class="q">${it.no}. ${LEAD[it.no]}, and follow the directions. [${it.pts} points]</h2>
    ${box("A", it.A)}
    ${box("B", it.B + (auto.opts ? `<div class="pickinfo" id="pinfo"></div>` : ""))}
    <p class="dir">${it.dir}</p>
    ${auto.write === false ? "" : `<div class="wlabel">서술 답안</div>
    <textarea id="ans" placeholder="조건·일반화 등 서술 부분을 영어로 작성하세요."></textarea>`}`;

  // 서술 답안
  const ta = $("ans");
  if (ta) { ta.value = answers[cur]; ta.addEventListener("input", () => { answers[cur] = ta.value; }); }

  // 선택지
  itemEl.querySelectorAll(".opt input").forEach(cb => {
    cb.checked = picks[cur].has(cb.value);
    cb.addEventListener("change", () => {
      cb.checked ? picks[cur].add(cb.value) : picks[cur].delete(cb.value);
      refresh();
    });
  });

  // 빈칸
  itemEl.querySelectorAll("input.bl").forEach(inp => {
    const k = +inp.dataset.blank;
    inp.value = blanks[cur][k];
    inp.addEventListener("input", () => { blanks[cur][k] = inp.value; refresh(); });
  });

  fbEl.innerHTML = `
    <h3>정답</h3><div>${it.key}</div>
    <h3>모범답안</h3><div class="model">${it.model}</div>
    <h3>채점 기준 · 자기 채점</h3>
    <table class="rub"><tr><th>채점 요소</th><th>배점</th></tr>
      ${it.rubric.map((r, k) => `<tr><td><label><input type="checkbox" data-k="${k}"> <span>${r[0]}${r[2] ? ' <span style="color:var(--muted);font-size:13px">(자동)</span>' : ""}</span></label></td><td class="pt">${r[1]}</td></tr>`).join("")}
    </table>
    <div class="score">이 문항 점수: <b id="isc"></b> / ${it.pts}</div>
    <div class="score">선택지·빈칸 항목은 자동으로 채점되고, 서술 항목은 모범답안과 비교해 직접 체크하세요. 자동 결과도 바꿀 수 있습니다.</div>
    <h3>해설</h3><ul>${it.notes.map(n => `<li>${n}</li>`).join("")}</ul>`;
  fbEl.querySelectorAll(".rub input").forEach(cb =>
    cb.addEventListener("change", () => { checks[cur][+cb.dataset.k] = cb.checked; syncScore(); }));

  setOpen(opened[cur]);
}

/* 선택 개수 안내 + (정답 열림 상태면) 표시·자동 채점 갱신 */
function refresh() {
  const n = need(), info = $("pinfo");
  if (info) {
    const c = picks[cur].size;
    info.textContent = `선택 ${c} / ${n}` + (c > n ? ` — ${n}개를 넘게 고르면 선택지 점수는 0점입니다.` : "");
    info.classList.toggle("over", c > n);
  }
  if (opened[cur]) { autoGrade(); mark(true); } else { mark(false); }
}

function autoGrade() {
  const it = ITEMS[cur], over = picks[cur].size > need();
  it.rubric.forEach((r, k) => {
    if (!r[2]) return;
    const [t, v] = r[2].split(":");
    checks[cur][k] = t === "o" ? (!over && picks[cur].has(v)) : blankOK(+v);
  });
  syncScore();
}

function syncScore() {
  fbEl.querySelectorAll(".rub input").forEach(cb => { cb.checked = checks[cur][+cb.dataset.k]; });
  const s = $("isc"); if (s) s.textContent = itemScore(cur);
  updateTotal();
}

function mark(on) {
  const auto = AUTO[ITEMS[cur].no];
  itemEl.querySelectorAll(".opt").forEach(el => {
    const l = el.dataset.opt, sel = picks[cur].has(l), right = (auto.opts || []).includes(l);
    el.classList.toggle("ok", on && sel && right);
    el.classList.toggle("ng", on && sel && !right);
    el.classList.toggle("miss", on && !sel && right);
  });
  itemEl.querySelectorAll("input.bl").forEach(inp => {
    const k = +inp.dataset.blank, ok = blankOK(k);
    const key = itemEl.querySelector(`.blkey[data-key="${k}"]`);
    inp.classList.toggle("ok", on && ok);
    inp.classList.toggle("ng", on && !ok);
    key.textContent = on ? (ok ? "✓" : `✗ ${auto.blanks[k][0]}`) : "";
    key.classList.toggle("ng", on && !ok);
  });
}

function setOpen(v) {
  opened[cur] = v;
  fbEl.classList.toggle("hidden", !v);
  $("toggle").textContent = v ? "정답 · 해설 숨기기" : "정답 · 해설 보기";
  refresh();
  syncScore();
}

const go = i => { cur = i; render(); window.scrollTo(0, 0); };
pick.addEventListener("change", () => go(+pick.value));
$("prev").addEventListener("click", () => { if (cur > 0) go(cur - 1); });
$("next").addEventListener("click", () => { if (cur < ITEMS.length - 1) go(cur + 1); });
$("toggle").addEventListener("click", () => setOpen(!opened[cur]));
$("clear").addEventListener("click", () => {
  answers[cur] = ""; picks[cur].clear(); blanks[cur] = blanks[cur].map(() => "");
  checks[cur] = checks[cur].map(() => false);
  render();
});

render();
updateTotal();
</script>
</body>
</html>
