  * { box-sizing: border-box; }

  .btn { font: inherit; font-weight: 600; font-size: 0.92rem; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--paper); color: var(--accent); }

  .btn.small { border-color: var(--line); color: var(--ink); }

    background: var(--paper); cursor: pointer; font-family: "Noto Serif", serif; font-size: 1.05rem; user-select: none;

  .item.on { border-color: var(--accent); background: var(--soft); }
  .item.ok { border-color: var(--ok); background: var(--ok-bg); }
  .item.missed { border-color: var(--ok); border-style: dashed; }
  .item.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .tag { margin-left: auto; font-family: "Noto Sans", sans-serif; font-size: 0.75rem; font-weight: 600; }
  .ok .tag { color: var(--ok); } .missed .tag { color: var(--ok); } .wrong .tag { color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; }
  .feedback.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .feedback.bad { background: var(--bad-bg); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 4px 0; }
  .source { margin-top: 20px; font-size: 0.8rem; color: var(--muted); }

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some(x => x !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); if (row.some(x => x !== "")) rows.push(row); }
  return rows;
}

function buildRules(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  const head = rows.shift().map(h => h.trim());
  const need = ["rule_label", "description", "set", "option", "item_text", "is_correct"];
  const idx = Object.fromEntries(need.map(k => [k, head.indexOf(k)]));
  if (need.some(k => idx[k] < 0)) throw new Error("CSV is missing required columns");
  const rules = new Map();
  rows.forEach(r => {
    const label = r[idx.rule_label].trim();
    if (!label) return;
    if (!rules.has(label)) rules.set(label, { desc: r[idx.description].trim(), sets: new Map() });
    const rule = rules.get(label);
    const s = Number(r[idx.set]);
    if (!rule.sets.has(s)) rule.sets.set(s, []);
    rule.sets.get(s).push({ option: Number(r[idx.option]), text: r[idx.item_text].trim(), correct: String(r[idx.is_correct]).trim() === "1" });
  });
  return [...rules.entries()].map(([label, v]) => ({
    label, desc: v.desc,
    sets: [...v.sets.entries()].sort((a, b) => a[0] - b[0]).map(([, items]) => items.sort((a, b) => a.option - b.option)),
  }));
}

    let cls = on ? "on" : "", tag = "";
    if (st.checked) {
      if (it.correct && on) { cls = "ok"; tag = "✓"; }
      else if (it.correct && !on) { cls = "missed"; tag = "missed"; }
      else if (!it.correct && on) { cls = "wrong"; tag = "✗"; }
      else cls = "";
    }
    return `<label class="item ${cls}"><input type="checkbox" data-i="${i}" ${on ? "checked" : ""}><span>${esc(it.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</label>`;
  }).join("");
  $("items").querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
    const i = Number(cb.dataset.i);
    cb.checked ? st.picked.add(i) : st.picked.delete(i);
    if (st.checked) { st.checked = false; $("feedback").hidden = true; }
    render();
  }));
}

function check() {
  const items = RULES[st.rule].sets[st.set];
  const missed = items.filter((it, i) => it.correct && !st.picked.has(i)).map(it => it.text);
  const extra = items.filter((it, i) => !it.correct && st.picked.has(i)).map(it => it.text);
  st.checked = true;
  const fb = $("feedback");
  if (!missed.length && !extra.length) {
    fb.className = "feedback ok"; fb.textContent = "🎉 Well done! You found every item that follows this rule.";
  } else {
    fb.className = "feedback bad";
    let h = `<p><strong>Not quite.</strong> See the feedback below.</p>`;
    if (missed.length) h += `<p><strong>You missed these correct items:</strong> ${missed.map(esc).join(", ")}</p>`;
    if (extra.length) h += `<p><strong>These should not be selected:</strong> ${extra.map(esc).join(", ")}</p>`;
    fb.innerHTML = h;
  }
  fb.hidden = false;
  render();
}

function resetSel() { st.picked.clear(); st.checked = false; $("feedback").hidden = true; render(); }

function start(text, sourceNote) {
  RULES = buildRules(text);
  fillRules();
  st.set = 0; resetSel();
  $("source").textContent = sourceNote;
}

$("rule").addEventListener("change", e => { st.rule = Number(e.target.value); st.set = 0; resetSel(); });
$("nextSet").addEventListener("click", () => { st.set = (st.set + 1) % RULES[st.rule].sets.length; resetSel(); });
$("reset").addEventListener("click", resetSel);
$("check").addEventListener("click", check);

// Show the bundled copy at once, then switch to the latest CSV on GitHub if it loads.
start(SNAPSHOT_CSV, "Data: bundled copy of allophonic_rules_dataset.csv.");
fetch(RAW_URL, { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(text => {
    const keepRule = RULES[st.rule] && RULES[st.rule].label;
    const before = JSON.stringify(RULES);
    const fresh = buildRules(text);
    if (JSON.stringify(fresh) === before) { $("source").textContent = "Data: latest allophonic_rules_dataset.csv from GitHub."; return; }
    RULES = fresh;
    const k = RULES.findIndex(r => r.label === keepRule);
    st.rule = k >= 0 ? k : 0;
    fillRules(); st.set = 0; resetSel();
    $("source").textContent = "Data: latest allophonic_rules_dataset.csv from GitHub.";
  })
  .catch(() => { /* keep the bundled copy */ });
</script>
</body>
</html>
