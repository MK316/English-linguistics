<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allophonic Rules Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --paper: #ffffff; --ink: #1b1b1b; --muted: #5d5a54; --line: #d9d4ca;
    --accent: #1f4e8c; --accent-ink: #ffffff; --soft: #eef2f8;
    --ok: #1d7a46; --ok-bg: #e7f5ec; --bad: #b3261e; --bad-bg: #fbeceb; --warn-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --line: #3a3a3a;
      --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a;
      --ok: #6fd39a; --ok-bg: #16301f; --bad: #f2928b; --bad-bg: #3a1c1a; --warn-bg: #3a3215;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --line: #3a3a3a;
    --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a;
    --ok: #6fd39a; --ok-bg: #16301f; --bad: #f2928b; --bad-bg: #3a1c1a; --warn-bg: #3a3215;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 18px; }
  label.lbl { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
  select { font: inherit; width: 100%; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  .desc { margin: 16px 0 0; padding: 12px 14px; background: var(--soft); border-radius: 8px; font-family: "Noto Serif", serif; }
  .desc b { font-family: "Noto Sans", sans-serif; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
  .setinfo { color: var(--muted); font-size: 0.88rem; margin-left: auto; }
  .btn { font: inherit; font-weight: 600; font-size: 0.92rem; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--paper); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.small { border-color: var(--line); color: var(--ink); }
  .btn:focus-visible, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .items { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
  @media (max-width: 560px) { .items { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    background: var(--paper); cursor: pointer; font-family: "Noto Serif", serif; font-size: 1.05rem; user-select: none;
  }
  .item input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .item.on { border-color: var(--accent); background: var(--soft); }
  .item.ok { border-color: var(--ok); background: var(--ok-bg); }
  .item.missed { border-color: var(--ok); border-style: dashed; }
  .item.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .tag { margin-left: auto; font-family: "Noto Sans", sans-serif; font-size: 0.75rem; font-weight: 600; }
  .ok .tag { color: var(--ok); } .missed .tag { color: var(--ok); } .wrong .tag { color: var(--bad); }
  .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.95rem; }
  .feedback.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
  .feedback.bad { background: var(--bad-bg); }
  .feedback.bad strong { color: var(--bad); }
  .feedback p { margin: 4px 0; }
  .source { margin-top: 20px; font-size: 0.8rem; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>English Allophonic Rule Practice</h1>
  <p class="sub">Choose a rule, select all the items that exemplify it, then check your answer. Use “Show me another set of words” for new items.</p>

  <section class="panel">
    <label class="lbl" for="rule">Rule</label>
    <select id="rule"></select>
    <div class="desc" id="desc"></div>

    <div class="row">
      <button type="button" class="btn" id="nextSet">Show me another set of words</button>
      <button type="button" class="btn small" id="reset">Reset selections</button>
      <span class="setinfo" id="setinfo"></span>
    </div>

    <div class="items" id="items" role="group" aria-label="Items"></div>

    <div class="row">
      <button type="button" class="btn primary" id="check">Check the answer</button>
    </div>
    <div class="feedback" id="feedback" hidden aria-live="polite"></div>
  </section>
  <p class="source" id="source"></p>
</div>

<script>
const RAW_URL = /*__RAW_URL__*/"";   // empty = use only the CSV injected below
const SNAPSHOT_CSV = /*__CSV__*/"";

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') q = false;
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.some(x => x !== "")) rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); if (row.some(x => x !== "")) rows.push(row); }
  return rows;
}

function buildRules(text) {
  const rows = parseCSV(text.replace(/^﻿/, ""));
  const head = rows.shift().map(h => h.trim());
  const need = ["rule_label", "description", "set", "option", "item_text", "is_correct"];
  const idx = Object.fromEntries(need.map(k => [k, head.indexOf(k)]));
  if (need.some(k => idx[k] < 0)) throw new Error("CSV is missing required columns");
  const rules = new Map();
  rows.forEach(r => {
    const label = r[idx.rule_label].trim();
    if (!label) return;
    if (!rules.has(label)) rules.set(label, { desc: r[idx.description].trim(), sets: new Map() });
    const rule = rules.get(label);
    const s = Number(r[idx.set]);
    if (!rule.sets.has(s)) rule.sets.set(s, []);
    rule.sets.get(s).push({ option: Number(r[idx.option]), text: r[idx.item_text].trim(), correct: String(r[idx.is_correct]).trim() === "1" });
  });
  return [...rules.entries()].map(([label, v]) => ({
    label, desc: v.desc,
    sets: [...v.sets.entries()].sort((a, b) => a[0] - b[0]).map(([, items]) => items.sort((a, b) => a.option - b.option)),
  }));
}

let RULES = [];
const st = { rule: 0, set: 0, picked: new Set(), checked: false };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function fillRules() {
  const sel = $("rule");
  sel.innerHTML = RULES.map((r, i) => `<option value="${i}">${esc(r.label)}</option>`).join("");
  sel.value = Math.min(st.rule, RULES.length - 1);
}

function render() {
  const rule = RULES[st.rule];
  const items = rule.sets[st.set];
  $("desc").innerHTML = `<b>Rule description</b>${esc(rule.desc)}`;
  $("setinfo").textContent = `Set ${st.set + 1} of ${rule.sets.length}`;
  $("items").innerHTML = items.map((it, i) => {
    const on = st.picked.has(i);
    let cls = on ? "on" : "", tag = "";
    if (st.checked) {
      if (it.correct && on) { cls = "ok"; tag = "✓"; }
      else if (it.correct && !on) { cls = "missed"; tag = "missed"; }
      else if (!it.correct && on) { cls = "wrong"; tag = "✗"; }
      else cls = "";
    }
    return `<label class="item ${cls}"><input type="checkbox" data-i="${i}" ${on ? "checked" : ""}><span>${esc(it.text)}</span>${tag ? `<span class="tag">${tag}</span>` : ""}</label>`;
  }).join("");
  $("items").querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => {
    const i = Number(cb.dataset.i);
    cb.checked ? st.picked.add(i) : st.picked.delete(i);
    if (st.checked) { st.checked = false; $("feedback").hidden = true; }
    render();
  }));
}

function check() {
  const items = RULES[st.rule].sets[st.set];
  const missed = items.filter((it, i) => it.correct && !st.picked.has(i)).map(it => it.text);
  const extra = items.filter((it, i) => !it.correct && st.picked.has(i)).map(it => it.text);
  st.checked = true;
  const fb = $("feedback");
  if (!missed.length && !extra.length) {
    fb.className = "feedback ok"; fb.textContent = "🎉 Well done! You found every item that follows this rule.";
  } else {
    fb.className = "feedback bad";
    let h = `<p><strong>Not quite.</strong> See the feedback below.</p>`;
    if (missed.length) h += `<p><strong>You missed these correct items:</strong> ${missed.map(esc).join(", ")}</p>`;
    if (extra.length) h += `<p><strong>These should not be selected:</strong> ${extra.map(esc).join(", ")}</p>`;
    fb.innerHTML = h;
  }
  fb.hidden = false;
  render();
}

function resetSel() { st.picked.clear(); st.checked = false; $("feedback").hidden = true; render(); }

function start(text, sourceNote) {
  RULES = buildRules(text);
  fillRules();
  st.set = 0; resetSel();
  $("source").textContent = sourceNote;
}

$("rule").addEventListener("change", e => { st.rule = Number(e.target.value); st.set = 0; resetSel(); });
$("nextSet").addEventListener("click", () => { st.set = (st.set + 1) % RULES[st.rule].sets.length; resetSel(); });
$("reset").addEventListener("click", resetSel);
$("check").addEventListener("click", check);

// Data comes from assets/allophonic_rules_dataset.csv, injected by the Streamlit page.
if (SNAPSHOT_CSV) {
  start(SNAPSHOT_CSV, "Data: assets/allophonic_rules_dataset.csv");
} else {
  document.querySelector(".panel").innerHTML = "<p>No data found. Put allophonic_rules_dataset.csv in the assets folder.</p>";
}
if (RAW_URL) {
  fetch(RAW_URL, { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const keepRule = RULES[st.rule] && RULES[st.rule].label;
      RULES = buildRules(text);
      const k = RULES.findIndex(r => r.label === keepRule);
      st.rule = k >= 0 ? k : 0;
      fillRules(); st.set = 0; resetSel();
      $("source").textContent = "Data: " + RAW_URL;
    })
    .catch(() => {});
}
</script>
</body>
</html>
