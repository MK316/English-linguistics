<script>
const ITEMS = [
{
  id:"rule-ordering-1",
  section:"Phonology",
  topic:"Rule ordering",
  points:4,
  fields:[
    {id:"a",label:"Relationship between NA and CCR in set A",type:"text",accept:["feeding"]},
    {id:"b",label:"Vowel length difference in set B",type:"essay"}
  ],
  paper:`
<p class="lead">Read the passage and follow the directions. [4 points]</p>
<p>When two phonological rules, Rule X and Rule Y, apply to the same form, their order may be crucial. Suppose Rule X applies before Rule Y.</p>
<ul class="defs">
 <li><b>Feeding:</b> Rule X creates the environment for Rule Y, so Rule Y applies.</li>
 <li><b>Bleeding:</b> Rule X destroys the environment for Rule Y, so Rule Y does not apply.</li>
</ul>
<p>Now suppose Rule X could affect the environment of Rule Y, but applies <i>after</i> Rule Y.</p>
<ul class="defs">
 <li><b>Counterfeeding:</b> Rule X would create the environment for Rule Y, but because it applies too late, Rule Y does not apply.</li>
 <li><b>Counterbleeding:</b> Rule X would destroy the environment for Rule Y, but because it applies too late, Rule Y still applies.</li>
</ul>
<p>The data in (1) come from most varieties of American English. The last column gives the rules involved in each set. Assume that the flap [ɾ] is a voiced segment.</p>
<div class="ex"><span class="ex-n">(1)</span></div>
<div class="tbl"><table>
 <thead><tr><th></th><th>Word</th><th>Phonemic form</th><th>Phonetic form</th><th>Rules involved</th></tr></thead>
 <tbody>
  <tr><td class="set" rowspan="2">A</td><td>pumpkin</td><td>/pʌmpkɪn/</td><td>[pʌŋkɪn]</td><td rowspan="2">Nasal Assimilation (NA)<br>Consonant Cluster Reduction (CCR)</td></tr>
  <tr><td>handcrafted</td><td>/hændkræftɪd/</td><td>[hæŋkræftɪd]</td></tr>
  <tr><td class="set" rowspan="2">B</td><td>ladder</td><td>/lædər/</td><td>[læːɾər]</td><td rowspan="2">Vowel Lengthening (VL)<br>Flapping (FL)</td></tr>
  <tr><td>latter</td><td>/lætər/</td><td>[læɾər]</td></tr>
 </tbody>
</table></div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Identify the relationship between NA and CCR in set A using ONE term from the passage. Then, explain the vowel length difference in set B, showing how VL and FL apply to both <i>ladder</i> and <i>latter</i> in the correct order.</p>
</div>`,
  answer:`
<p>Set A: <b>feeding</b> (CCR → NA)</p>
<p>VL applies before FL. In /lædər/, the vowel is followed by voiced /d/, so VL lengthens it; FL then changes /d/ to [ɾ], which gives [læːɾər]. In /lætər/, the vowel is followed by voiceless /t/ when VL applies, so it is not lengthened. FL creates the voiced [ɾ] only afterward, so the vowel stays short: [læɾər].</p>`,
  rubric:[
    ["feeding",1],
    ["VL이 FL보다 먼저 적용됨",1],
    ["ladder: 기저형의 /d/가 유성음이라 VL 적용 → 장모음",1],
    ["latter: VL 적용 시점에 /t/가 무성음 → 장음화 안 됨, [ɾ]는 그 후에 생김",1]
  ],
  notes:[
    "Set B는 counterfeeding이지만 용어는 요구하지 않음. 용어를 써서 정확히 설명하면 감점 없이 인정.",
    "\"in the correct order\"는 순서를 밝히지 않으므로 VL → FL 판단 1점은 유지됨.",
    "도출 과정은 문장이나 도출표 형식 모두 인정.",
    "pumpkin은 /m/이 이미 /p/와 같은 조음위치라 NA를 먼저 적용해도 변화 없음 → *[pʌmkɪn] (함정 포인트)."
  ]
},
{
  id:"infl-deriv-1",
  section:"Morphology",
  topic:"Inflectional vs. derivational",
  points:2,
  fields:[
    {id:"a",label:"Blank ①",type:"text",accept:["category"]},
    {id:"b",label:"Sentences with a derivational suffix",type:"select",answer:"bceg"}
  ],
  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [2 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>Bound morphemes that attach to a root or stem are called affixes, and they come in two types. English has only eight inflectional affixes: {PLU}, {POSS}, {COMP}, {SUP}, {PRES}, {PAST}, {PAST PART}, and {PRES PART}. They mark grammatical properties such as number, tense, and degree, and they never change the grammatical ( ① ) of the word they attach to. All other affixes are derivational. A derivational affix forms a new word, which may or may not belong to a different ( ① ) from its base. Note that an inflectional affix and a derivational affix can share the same form. For example, the <i>-er</i> in <i>older</i> marks {COMP}, but the <i>-er</i> in <i>kicker</i> turns a verb into a noun.</p>
</div>
<div class="box"><span class="box-h">&lt;B&gt;</span>
 <ul class="blist">
  <li><span>a.</span><span>My brother is a year <u>older</u> than me.</span></li>
  <li><span>b.</span><span>The <u>driver</u> stopped at the corner.</span></li>
  <li><span>c.</span><span>The <u>carpeting</u> in the hall is brand new.</span></li>
  <li><span>d.</span><span>She is <u>driving</u> to Busan right now.</span></li>
  <li><span>e.</span><span>An <u>aged</u> man sat quietly on the bench.</span></li>
  <li><span>f.</span><span>He <u>walked</u> to school yesterday.</span></li>
  <li><span>g.</span><span>She gave the new student a <u>friendly</u> smile.</span></li>
  <li><span>h.</span><span>He <u>walks</u> his dog every morning.</span></li>
 </ul>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Fill in the blank ① in &lt;A&gt; with ONE word. Then, based on &lt;A&gt;, identify ALL the sentences in &lt;B&gt; in which the suffix of the underlined word is derivational.</p>
</div>`,
  answer:`
<p>① <b>category</b></p>
<p>Derivational: <b>b, c, e, g</b></p>
<p>b. <i>driv-er</i>: V → N. c. <i>carpet-ing</i>: a noun meaning carpet material, not {PRES PART}. e. <i>ag-ed</i>: an adjective, not {PAST} or {PAST PART}. g. <i>friend-ly</i>: N → Adj.<br>Inflectional: a {COMP}, d {PRES PART}, f {PAST}, h {PRES}.</p>`,
  rubric:[
    ["① category",1],
    ["b, c, e, g를 모두 고르고 다른 것은 고르지 않음",1]
  ],
  notes:[
    "슬라이드 6~8, 16 (8 inflectional morphemes, -ize/-ful/-ly, carpeting·aged)",
    "같은 형태의 접미사를 짝지어 넣음: -er (a/b), -ing (c/d), -ed (e/f), -ly(g)·-s(h).",
    "c와 e가 핵심 함정. -ing/-ed가 굴절처럼 보이지만 슬라이드 16의 분석에 따라 파생.",
    "기출(31번)의 '맞는 진술 고르기' 대신 '해당 문장 모두 고르기'로 바꿈."
  ]
},
{
  id:"rdi-order-1",
  section:"Morphology",
  topic:"Order of affixes (RDI)",
  points:2,
  fields:[
    {id:"a",label:"Well-formed words that appear to violate RDI",type:"select",answer:"ce"}
  ],
  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [2 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>When a word contains both a derivational and an inflectional suffix, the general order is Root + Derivational + Inflectional (RDI), as in <i>friend-ship-s</i>. Once an inflectional suffix has been added, no further derivational suffix can follow. This is why <i>*happierness</i> is impossible.</p>
 <p>Some words, however, seem to break this order. The derivational suffix <i>-ly</i> normally attaches only to an adjective base, as in <i>happily</i>. A process called category extension converts a word into a new category with no change in form. When it turns an inflected verb form into an adjective, it creates a base to which <i>-ly</i> can attach.</p>
</div>
<div class="box"><span class="box-h">&lt;B&gt;</span>
 <ul class="blist">
  <li><span>a.</span><span>friendships</span></li>
  <li><span>b.</span><span>happierness</span></li>
  <li><span>c.</span><span>lovingly</span></li>
  <li><span>d.</span><span>menly</span></li>
  <li><span>e.</span><span>markedly</span></li>
  <li><span>f.</span><span>createsive</span></li>
  <li><span>g.</span><span>governments</span></li>
 </ul>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Based on &lt;A&gt;, identify ALL the words in &lt;B&gt; that are well-formed even though they appear to violate the RDI order.</p>
</div>`,
  answer:`
<p>Words: <b>c, e</b></p>
<p>In <i>lovingly</i> and <i>markedly</i>, an inflectional suffix ({PRES PART} <i>-ing</i>, {PAST PART} <i>-ed</i>) appears before the derivational suffix <i>-ly</i>, which looks like a violation of RDI. However, <i>-ly</i> needs an adjective base. Category extension first turns the verb forms <i>loving</i> and <i>marked</i> into adjectives with no change in form. This creates the adjective base, so <i>-ly</i> can attach: [loving]<sub>Adj</sub> + -ly, [marked]<sub>Adj</sub> + -ly. Category extension feeds the attachment of <i>-ly</i>.</p>`,
  rubric:[
    ["c, e를 모두 고르고 다른 것은 고르지 않음",2]
  ],
  notes:[
    "슬라이드 10~18, 22 (RDI order, lovingly/markedly, category extension feeds -ly)",
    "a, g는 정상적인 RDI, b, d, f는 RDI를 어긴 비문 (슬라이드 11). 오답 선택지 역할.",
    "하나라도 빠지거나 오답이 섞이면 0점 (부분 점수 없음). 부분 점수를 주려면 c, e 각 1점으로 나누고 오답 선택 시 감점하는 방식 가능.",
    "모범 답안의 설명은 채점용이 아닌 참고용."
  ]
},
{
  id:"wf-match-1",
  section:"Morphology",
  topic:"Word formation (matching)",
  points:2,
  fields:[
    {id:"m",label:"Match each process with a sentence",type:"match",options:"abcdef",rows:[["(1)","Blending","c"],["(2)","Acronym","a"],["(3)","Category extension","b"],["(4)","Back formation","d"]]}
  ],
  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [2 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>English keeps adding new words. Some are borrowed from other languages, and others are built from material the language already has. The following are some of the processes by which new words are formed:</p>
 <div class="plist"><span>(1) Blending</span><span>(2) Acronym</span><span>(3) Category extension</span><span>(4) Back formation</span></div>
</div>
<div class="box"><span class="box-h">&lt;B&gt;</span>
 <ul class="blist">
  <li><span>a.</span><span>The ship&#39;s <u>radar</u> picked up a strange signal.</span></li>
  <li><span>b.</span><span>My sister <u>texted</u> me twice last night.</span></li>
  <li><span>c.</span><span>The whole city was covered in <u>smog</u> this morning.</span></li>
  <li><span>d.</span><span>My uncle likes to <u>bartend</u> on weekends.</span></li>
  <li><span>e.</span><span>We watched the election results on <u>TV</u>.</span></li>
  <li><span>f.</span><span>He ordered a <u>hamburger</u> and a soda.</span></li>
 </ul>
</div>
<div class="dir">

  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [4 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>Affixes are picky about the bases they attach to. The suffix <i>-ful</i> turns a noun into an adjective, and the suffix <i>-ness</i> turns an adjective into a noun. So in <i>carefulness</i>, <i>-ful</i> must combine with the noun <i>care</i> first to form the adjective <i>careful</i>, and <i>-ness</i> is added afterward. The reverse order is impossible, because <i>-ness</i> cannot attach to the noun <i>care</i>.</p>
 <p>The prefix <i>un-</i> is less picky. Attached to a verb, it means 'reverse the action', as in <i>untie</i>. Attached to an adjective, it means 'not', as in <i>unkind</i>. As a result, a word containing <i>un-</i>, a verb, and <i>-able</i> can have two structures, each with its own meaning:</p>
 <div class="trees">
  <div class="tree"><span>(1)</span><svg viewBox="0 0 300 215" width="300" role="img"><line x1="150" y1="30" x2="85" y2="66"/><line x1="150" y1="30" x2="230" y2="66"/><line x1="85" y1="90" x2="35" y2="126"/><line x1="85" y1="90" x2="135" y2="126"/><line x1="135" y1="150" x2="135" y2="190"/><text x="150" y="22" text-anchor="middle">Adjective</text><text x="85" y="82" text-anchor="middle">( ① )</text><text x="230" y="82" text-anchor="middle">able</text><text x="35" y="142" text-anchor="middle">un</text><text x="135" y="142" text-anchor="middle">( ② )</text><text x="135" y="207" text-anchor="middle">do</text></svg></div>

 </div>

</div>`,
  answer:`
<p>① <b>Verb</b> &nbsp; ② <b>Verb</b> &nbsp; ③ <b>Adjective</b> &nbsp; ④ <b>Verb</b></p>
<p>Structure (1): <b>a, c</b> &nbsp; Structure (2): <b>b</b></p>
<p>In (1), <i>un-</i> attaches to the verb <i>do</i> to form the verb <i>undo</i>, and <i>-able</i> follows: 'able to be undone'. In (2), <i>-able</i> first forms the adjective <i>doable</i>, and <i>un-</i> means 'not': 'not able to be done'. In c, <i>no longer undoable</i> means the repair can no longer be reversed, so it is structure (1).</p>`,

  paper:`
<p class="lead">Read the passage and follow the directions. [4 points]</p>
<div class="box">
 <p>Compounds are built in layers, just as derived words are. In an English compound, the rightmost member normally determines the grammatical category of the whole. For example, <i>blackboard</i> combines an adjective and a noun, and it is a noun because <i>board</i> is a noun. A member of a compound may itself be complex. In <i>bookseller</i>, the suffix <i>-er</i> first turns the verb <i>sell</i> into the noun <i>seller</i>, which then combines with <i>book</i>.</p>
 <p>Because the layers are not visible in speech, the same string of morphemes can sometimes be grouped in two different ways. Consider the string <i>light + house + keep + -er</i>, which can be analyzed as follows:</p>
 <div class="trees">
  <div class="tree"><span>(1)</span><svg viewBox="0 0 320 215" width="320" role="img"><line x1="160" y1="30" x2="80" y2="66"/><line x1="160" y1="30" x2="240" y2="66"/><line x1="80" y1="90" x2="40" y2="126"/><line x1="80" y1="90" x2="120" y2="126"/><line x1="240" y1="90" x2="205" y2="126"/><line x1="240" y1="90" x2="285" y2="126"/><line x1="205" y1="150" x2="205" y2="190"/><text x="160" y="22" text-anchor="middle">Noun</text><text x="80" y="82" text-anchor="middle">( ① )</text><text x="240" y="82" text-anchor="middle">Noun</text><text x="40" y="142" text-anchor="middle">light</text><text x="120" y="142" text-anchor="middle">house</text><text x="205" y="142" text-anchor="middle">( ② )</text><text x="285" y="142" text-anchor="middle">-er</text><text x="205" y="207" text-anchor="middle">keep</text></svg></div>
  <div class="tree"><span>(2)</span><svg viewBox="0 0 330 275" width="330" role="img"><line x1="160" y1="30" x2="60" y2="66"/><line x1="160" y1="30" x2="225" y2="66"/><line x1="60" y1="90" x2="60" y2="126"/><line x1="225" y1="90" x2="170" y2="126"/><line x1="225" y1="90" x2="275" y2="126"/><line x1="275" y1="150" x2="240" y2="186"/><line x1="275" y1="150" x2="310" y2="186"/><line x1="240" y1="210" x2="240" y2="250"/><text x="160" y="22" text-anchor="middle">Noun</text><text x="60" y="82" text-anchor="middle">( ③ )</text><text x="225" y="82" text-anchor="middle">( ④ )</text><text x="60" y="142" text-anchor="middle">light</text><text x="170" y="142" text-anchor="middle">house</text><text x="275" y="142" text-anchor="middle">Noun</text><text x="240" y="202" text-anchor="middle">Verb</text><text x="310" y="202" text-anchor="middle">-er</text><text x="240" y="267" text-anchor="middle">keep</text></svg></div>
 </div>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Fill in the blanks ①–④ with the grammatical category of each node. Then, write the meaning of the whole expression under structure (1) and under structure (2).</p>
</div>`,
  answer:`
<p>① <b>Noun</b> &nbsp; ② <b>Verb</b> &nbsp; ③ <b>Adjective</b> &nbsp; ④ <b>Noun</b></p>
<p>(1) <i>lighthouse keeper</i>: a person who looks after a lighthouse.<br>(2) <i>light housekeeper</i>: a housekeeper who is light (for example, light in weight).</p>
<p>In (1), <i>light</i> and <i>house</i> form the compound noun <i>lighthouse</i>, which combines with <i>keeper</i>. In (2), <i>house</i> combines with <i>keeper</i> to form the noun <i>housekeeper</i>, which the adjective <i>light</i> modifies.</p>`,

{

  paper:`
<p class="lead">Read the passage and follow the directions. [2 points]</p>
<div class="box">
 <p>Each affix looks for a base of a particular category, and this restricts the order in which affixes can be added. The suffix <i>-ful</i> attaches to nouns and forms adjectives, as in <i>playful</i>. The prefix <i>un-</i>, meaning 'not', attaches to adjectives and keeps them adjectives, as in <i>unwary</i>. The suffix <i>-ness</i> attaches to adjectives and forms nouns, as in <i>kindness</i>.</p>
 <p>Now consider <i>unhelpfulness</i>. Both <i>un-</i> and <i>-ness</i> need an adjective base, so neither can attach to the noun <i>help</i> directly. Once an adjective has been formed, <i>-ness</i> could attach to it, but the result would be a noun, to which <i>un-</i> could no longer attach. The word must therefore be formed in three steps: first, <span class="gap">(1)</span> attaches to the noun <i>help</i>; second, <span class="gap">(2)</span> attaches to <span class="gap">(3)</span>; and finally, <i>-ness</i> is added to <span class="gap">(4)</span>.</p>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Based on the passage, fill in blanks (1)–(4) with ONE affix or ONE word each.</p>
</div>`,
  answer:`
<p>(1) <b>-ful</b> &nbsp; (2) <b>un-</b> &nbsp; (3) <b>helpful</b> &nbsp; (4) <b>unhelpful</b></p>
<p>help (N) → helpful (Adj) → unhelpful (Adj) → unhelpfulness (N). <i>un-</i> must come before <i>-ness</i>, because <i>helpfulness</i> is a noun and <i>un-</i> attaches only to adjectives.</p>`,
  rubric:[
    ["(1) -ful, (2) un- 모두 맞음",1],
    ["(3) helpful, (4) unhelpful 모두 맞음",1]
  ],
  notes:[
    "슬라이드 7~9 (-ful, un-, 파생접사의 범주 선택).",
    "기출의 un- + -able 대신 접사 3개가 붙는 단어로 바꿔 단계를 하나 늘림.",
    "핵심: un-과 -ness가 모두 형용사를 요구하므로 helpful에 둘 다 붙을 수 있지만, -ness가 먼저 붙으면 명사가 되어 un-이 붙을 수 없음.",
    "접사 답은 하이픈 유무와 관계없이 정답 처리 (-ful/ful, un-/un)."

},

  paper:`
<p class="lead">Read the passage and follow the directions. [2 points]</p>
<div class="box">
 <p>A derivational suffix can change the grammatical category of its base, and the new category in turn decides which suffix can come next. The suffix <i>-al</i> turns nouns into adjectives, as in <i>magical</i>. The suffix <i>-ize</i> turns nouns or adjectives into verbs, as in <i>criticize</i> and <i>normalize</i>. The suffix <i>-ation</i> turns verbs into nouns, as in <i>organization</i>.</p>
 <p>Starting from the noun <i>nation</i>, these three suffixes can build a long word step by step. First, <i>-al</i> creates the adjective <span class="gap">(1)</span>. Next, <i>-ize</i> attaches to it, yielding the <span class="gap">(2)</span> <i>nationalize</i>. Finally, <i>-ation</i> turns this word into <span class="gap">(3)</span>. The suffixes cannot be added in a different order. For example, <i>-ation</i> cannot attach directly to <i>national</i>, because <i>-ation</i> requires a base that is a <span class="gap">(4)</span>.</p>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Complete the passage. Write a word in blanks (1) and (3), and a grammatical category in blanks (2) and (4).</p>
</div>`,
  answer:`
<p>(1) <b>national</b> &nbsp; (2) <b>verb</b> &nbsp; (3) <b>nationalization</b> &nbsp; (4) <b>verb</b></p>
<p>nation (N) → national (Adj) → nationalize (V) → nationalization (N). Each suffix creates the category that the next suffix needs.</p>`,

  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [4 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>In Optimality Theory, a grammar is a set of constraints on outputs, and any constraint can be violated. The constraints are ranked: violating a higher-ranked constraint is worse than violating a lower-ranked one, so the output chosen is the one whose violations matter least. All speakers share the same constraints, but the ranking can differ, for example between a child and an adult. Consider the two constraints below.</p>
 <ul class="clist">
  <li><b>(i)</b><span>An output should not contain a velar stop, [k] or [g].</span></li>
  <li><b>(ii)</b><span>Each sound in the output should keep the place of articulation it has in the input.</span></li>
 </ul>
 <p>A young child ranks (i) higher than (ii), and says <i>key</i> /ki/ as [ti]. Adults rank the same two constraints the other way around, and say [ki].</p>
</div>
<div class="box"><span class="box-h">&lt;B&gt;</span>
 <p>The forms below are nonce words. They are not English words, but they are possible forms.</p>
 <ul class="blist">
  <li><span>a.</span><span>[kʌf]</span></li>
  <li><span>b.</span><span>[tɪb]</span></li>
  <li><span>c.</span><span>[gʊp]</span></li>
  <li><span>d.</span><span>[dɛp]</span></li>
  <li><span>e.</span><span>[bɪk]</span></li>
 </ul>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Choose the TWO nonce words in &lt;B&gt; that the child in &lt;A&gt; could produce. Then, explain why the child pronounces an input /kɛb/ as [tɛb] while an adult pronounces it as [kɛb], using the constraints and their ranking.</p>
</div>`,
  answer:`
<p>Words the child could produce: <b>b, d</b></p>
<p>For the child, (i) is ranked higher than (ii). Keeping [k] would violate the higher-ranked (i), so the child changes the place of /k/ and produces [t], which violates only the lower-ranked (ii): [tɛb]. For the adult, (ii) is ranked higher than (i). Changing the place of /k/ would violate the higher-ranked (ii), so the adult keeps [k] and violates only the lower-ranked (i): [kɛb]. The two speakers have the same constraints; only the ranking differs.</p>`,

  paper:`
<p class="lead">Read &lt;A&gt; and &lt;B&gt; and follow the directions. [4 points]</p>
<div class="box"><span class="box-h">&lt;A&gt;</span>
 <p>In Optimality Theory, the output a speaker produces does not have to satisfy every constraint. It only has to do better than the other possible outputs under the speaker's ranking. Some constraints prefer outputs that are easy to pronounce, while others prefer outputs that stay faithful to the input, so they often conflict. Consider the three constraints below.</p>
 <ul class="clist">
  <li><b>(i)</b><span>An output should not contain a consonant cluster.</span></li>
  <li><b>(ii)</b><span>An output should not contain a sound that is not in the input.</span></li>
  <li><b>(iii)</b><span>Every sound in the input should appear in the output.</span></li>
 </ul>
 <p>A child learning English ranks (i) highest, (ii) next, and (iii) lowest. This child says <i>plate</i> /pleɪt/ as [peɪt].</p>
</div>
<div class="box"><span class="box-h">&lt;B&gt;</span>
 <p>The forms below are nonce words. They are not English words, but they are possible forms.</p>
 <ul class="blist">
  <li><span>a.</span><span>/plɪm/ → [plɪm]</span></li>
  <li><span>b.</span><span>/plɪm/ → [pɪm]</span></li>
  <li><span>c.</span><span>/stɑb/ → [sətɑb]</span></li>
  <li><span>d.</span><span>/grʌf/ → [gʌf]</span></li>
  <li><span>e.</span><span>/blɛt/ → [bəlɛt]</span></li>
 </ul>
</div>
<div class="dir">
 <div class="dir-h">&lt;Directions&gt;</div>
 <p>Select the TWO input–output pairs in &lt;B&gt; that the child&#39;s grammar in &lt;A&gt; generates. Then, based on the ranking in &lt;A&gt;, explain why the child pronounces /blɛt/ as [bɛt], rather than [blɛt] or [bəlɛt].</p>
</div>`,
  answer:`
<p>Pairs the grammar generates: <b>b, d</b></p>
<p>[blɛt] keeps the cluster and violates (i), the highest-ranked constraint, so it loses. Both [bəlɛt] and [bɛt] avoid the cluster. [bəlɛt] inserts [ə] and violates (ii), while [bɛt] deletes /l/ and violates (iii). Since (ii) is ranked higher than (iii), inserting a sound is worse than deleting one, so [bɛt] is the best output.</p>`,

  ]
}

function feedbackFor(it,f){
  const fb=(FEEDBACK[it.id]||{})[f.id]||{};
  if(f.type==="essay"&&fb.checklist) return `<span class="fb-h">Check your answer for these points</span><ul>${fb.checklist.map(c=>`<li>${c}</li>`).join("")}</ul>`;
  if(f.type==="text"){const v=document.getElementById(`f-${it.id}-${f.id}`).value; return grade(f,v)?"":(fb.wrong||"");}
  if(f.type==="select"){
    const got=letters(document.getElementById(`f-${it.id}-${f.id}`).value), want=f.answer, msgs=[];
    [...want].filter(x=>!got.includes(x)).forEach(x=>msgs.push(`You left out <b>${x}</b>. ${fb.opts?.[x]||""}`));
    [...got].filter(x=>!want.includes(x)).forEach(x=>msgs.push(`<b>${x}</b> should not be included. ${fb.opts?.[x]||""}`));
    return msgs.length?`<ul>${msgs.map(m=>`<li>${m}</li>`).join("")}</ul>`:"";
  }
  if(f.type==="match"){
    const msgs=[];
    f.rows.forEach((r,k)=>{
      const v=document.getElementById(`f-${it.id}-${f.id}-${k}`).value;
      if(v===r[2]) return;
      const chose=v?`You chose <b>${v}</b>. ${fb.opts?.[v]||""} `:"You didn't choose a sentence. ";
      msgs.push(`${r[0]} ${r[1]}: ${chose}The answer is <b>${r[2]}</b>. ${fb.opts?.[r[2]]||""}`);
    });
    return msgs.length?`<ul>${msgs.map(m=>`<li>${m}</li>`).join("")}</ul>`:"";
  }
  return "";
}
function fieldHTML(it,f){
  if(f.type==="match"){
    const rows=f.rows.map((r,k)=>{
      const key=`ans:${it.id}:${f.id}:${k}`, v=store.get(key)||"", fid=`f-${it.id}-${f.id}-${k}`;
      const opts=['<option value="">—</option>',...[...f.options].map(o=>`<option value="${o}"${o===v?" selected":""}>${o}</option>`)].join("");
      return `<div class="mrow"><span>${r[0]}</span><label for="${fid}">${r[1]}</label><select id="${fid}" data-key="${key}">${opts}</select><span class="mark" id="m-${fid}"></span></div>`;
    }).join("");
    return `<div class="field"><span class="hint">Choose a sentence letter from &lt;B&gt; for each process.</span><div class="match">${rows}</div><div class="fb" id="fb-${it.id}-${f.id}" hidden></div></div>`;
  }
  const key=`ans:${it.id}:${f.id}`, v=store.get(key)||"", fid=`f-${it.id}-${f.id}`;
  const hint=f.type==="select"?'<span class="hint">Type the letters, e.g. a, d</span>':f.type==="essay"?'<span class="hint">Write in English. After checking, compare it with the points shown below.</span>':'';
  const ctrl=f.type==="essay"
    ?`<textarea id="${fid}" data-key="${key}">${v.replace(/</g,"&lt;")}</textarea>`
    :`<div class="row"><input id="${fid}" data-key="${key}" type="text" autocomplete="off" spellcheck="false" value="${v.replace(/"/g,"&quot;")}"><span class="mark" id="m-${fid}"></span></div>`;
  return `<div class="field"><label for="${fid}">${f.label}</label>${hint}${ctrl}<div class="fb" id="fb-${it.id}-${f.id}" hidden></div></div>`;
}
function buildPicker(){
  const secs=[...new Set(ITEMS.map(i=>i.section))];
  selEl.innerHTML=secs.map(sec=>`<optgroup label="${sec}">${ITEMS.map((it,n)=>it.section===sec?`<option value="${it.id}">Item ${n+1} · ${it.topic} [${it.points} pt${it.points>1?"s":""}]</option>`:"").join("")}</optgroup>`).join("");
  selEl.value=currentId;
  selEl.onchange=()=>go(selEl.value);
  document.getElementById("prev-item").onclick=()=>step(-1);
  document.getElementById("next-item").onclick=()=>step(1);
}
function go(id){currentId=id; selEl.value=id; store.set("tce-item",id); render();}
function step(d){const order=[...selEl.options].map(o=>o.value), k=order.indexOf(currentId); const n=order[k+d]; if(n) go(n);}
function render(){
  const list=ITEMS.filter(i=>i.id===currentId);
  itemsEl.innerHTML="";
  const order=[...selEl.options].map(o=>o.value), k=order.indexOf(currentId);
  document.getElementById("prev-item").disabled=k<=0;
  document.getElementById("next-item").disabled=k>=order.length-1;
  list.forEach(it=>{
    const total=it.rubric.reduce((a,r)=>a+r[1],0);
    const art=document.createElement("article"); art.className="sheet"; art.id=it.id;
    art.innerHTML=`
      <div class="sheet-head"><div><span class="qno">Item ${ITEMS.indexOf(it)+1}</span><span class="tag">${it.section}</span><span class="tag">${it.topic}</span></div><span class="pts">${it.points} points</span></div>
      <div class="paper">${it.paper}</div>
      <section class="sheet-ans" aria-label="Answer sheet">
        <h3>Your answer</h3>
        ${it.fields.map(f=>fieldHTML(it,f)).join("")}
        <div class="actions"><button class="btn" type="button" data-act="check">Check answers</button><button class="btn ghost" type="button" data-act="clear">Clear</button><span class="score" aria-live="polite"></span></div>
      </section>
      <details class="key"><summary>모범 답안 · 채점 기준</summary>
        <div class="key-body">
          <h3>Model answer</h3><div class="paper">${it.answer}</div>
          <h3>Scoring (${total} points)</h3>
          <div class="tbl"><table class="rubric"><thead><tr><th>요소</th><th>배점</th></tr></thead><tbody>
            ${it.rubric.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}
          </tbody></table></div>
          <h3>Notes</h3><ul class="notes">${it.notes.map(n=>`<li>${n}</li>`).join("")}</ul>
        </div></details>`;
    art.querySelectorAll("[data-key]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>store.set(el.dataset.key,el.value)));
    const scoreEl=art.querySelector(".score");
    art.querySelector('[data-act="check"]').onclick=()=>{
      let auto=0,right=0,essay=false;
      it.fields.forEach(f=>{
        if(f.type==="match"){
          f.rows.forEach((r,k)=>{const fid=`f-${it.id}-${f.id}-${k}`, ok=document.getElementById(fid).value===r[2]; auto++; if(ok) right++;
            const m=document.getElementById("m-"+fid); m.textContent=ok?"Correct":"Incorrect"; m.className="mark "+(ok?"ok":"no");});
          return;
        }
        const fid=`f-${it.id}-${f.id}`, v=document.getElementById(fid).value, ok=grade(f,v);
        if(ok===null){essay=true;return;}
        auto++; if(ok) right++;
        const m=document.getElementById("m-"+fid); m.textContent=ok?"Correct":"Incorrect"; m.className="mark "+(ok?"ok":"no");
      });
      it.fields.forEach(f=>{const box=document.getElementById(`fb-${it.id}-${f.id}`), html=feedbackFor(it,f); box.innerHTML=html; box.hidden=!html;});
      scoreEl.textContent=`${right} / ${auto} correct`+(essay?" · check the written part against the points below it":"");
      art.querySelector("details.key").open=true;
    };
    art.querySelector('[data-act="clear"]').onclick=()=>{
      art.querySelectorAll(".mrow select").forEach(el=>{el.value=""; store.del(el.dataset.key);});
      art.querySelectorAll(".mrow .mark").forEach(m=>{m.textContent="";m.className="mark";});
      it.fields.filter(f=>f.type!=="match").forEach(f=>{const fid=`f-${it.id}-${f.id}`; document.getElementById(fid).value=""; store.del(`ans:${it.id}:${f.id}`); const m=document.getElementById("m-"+fid); if(m){m.textContent="";m.className="mark";}});
      art.querySelectorAll(".fb").forEach(b=>{b.innerHTML="";b.hidden=true;});
      scoreEl.textContent=""; art.querySelector("details.key").open=false;
    };
    itemsEl.appendChild(art);
  });
}
buildPicker();
render();
</script>
