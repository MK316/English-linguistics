<style>

      --paper: #1f1f1f;
      --ink: #ececec;
      --muted: #a7a39b;
      --rule: #cfcfcf;
      --line: #3a3a3a;
      --accent: #7fa8e6;
      --accent-ink: #0e1a2b;
      --soft: #22293a;
      --ok: #6fd39a;
      --ok-bg: #16301f;
      --bad: #f2928b;
      --bad-bg: #3a1c1a;
      --blank-bg: #2c2817;
      --part: #e8c46a;
      --part-bg: #33291a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --rule: #cfcfcf; --line: #3a3a3a;
    --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a; --ok: #6fd39a; --ok-bg: #16301f;
    --bad: #f2928b; --bad-bg: #3a1c1a; --blank-bg: #2c2817; --part: #e8c46a; --part-bg: #33291a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Noto Serif", "Times New Roman", serif; font-size: 17px; line-height: 1.65;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 24px 16px 64px; }
  header { margin-bottom: 20px; }
  h1 {
    font-family: "Noto Sans", system-ui, sans-serif; font-weight: 600; font-size: 1.35rem;

  .sub { font-family: "Noto Sans", system-ui, sans-serif; color: var(--muted); font-size: 0.9rem; margin: 0; }
  .picker {

  select {
    font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);

  }
  .nav { display: flex; gap: 6px; }
  .nav button { padding: 8px 12px; }

  .paper {
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px 24px 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .qhead {
    display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
    gap: 4px 16px; margin: 0 0 18px; font-size: 1.05rem;
  }
  .qhead .q { flex: 1 1 320px; }
  .qnum { font-weight: 700; font-size: 1.35rem; margin-right: 6px; }
  .pts { font-weight: 700; white-space: nowrap; margin-left: auto; }

  .box {
    position: relative; border: 1px solid var(--rule); padding: 22px 18px 14px; margin: 22px 0 18px;
  }
  .box-label {
    position: absolute; top: 0; left: 50%; transform: translate(-50%, -55%);
    background: var(--paper); padding: 0 10px; font-size: 0.95rem; white-space: nowrap;
  }
  .box p { margin: 0 0 10px; }
  .box p:last-child { margin-bottom: 0; }
  .indent { text-indent: 1em; }
  .data { padding-left: 2.1em; text-indent: -2.1em; }
  .data .tag { display: inline-block; width: 2.1em; text-indent: 0; }
  .data-sub { padding-left: 2.1em; }
  .data-sub.hang { padding-left: 4.1em; text-indent: -2em; }

  .note { font-size: 0.94em; margin-top: 12px !important; }
  .pairs {
    display: grid; grid-template-columns: max-content max-content max-content; gap: 2px 14px;
    padding-left: 2.1em; margin: 6px 0 12px;
  }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; }
  @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }

  .directions { margin: 6px 0 0; }
  .case { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }

  .case-data { margin-top: 12px; }

  .step-title {

  .at-head {
    font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.85rem; color: var(--muted);

    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px;

  .fb-row.bad { background: var(--bad-bg); }
  .fb-row.partial { background: var(--part-bg); }
  .verdict { font-weight: 600; }
  .ok .verdict { color: var(--ok); }
  .bad .verdict { color: var(--bad); }
  .partial .verdict { color: var(--part); }
  details.expl { margin: 0 0 12px 4px; }

  .expl-body, .expl-text { font-family: "Noto Serif", serif; background: var(--soft); border-radius: 8px; padding: 10px 12px; margin-top: 6px; }
  .muted { color: var(--muted); }
  .dialog { margin-top: 16px !important; }
  .dlg-context { text-align: center; font-style: italic; margin: 0 0 8px !important; }
  .dlg-row { display: grid; grid-template-columns: 4.6em 1fr; gap: 0 8px; margin: 0 0 6px !important; }
  .dlg-row .who { font-weight: 700; }
  .blank-line { display: inline-block; min-width: 10em; border-bottom: 1px solid var(--ink); }
  .field-label { display: block; font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.9rem; color: var(--muted); margin: 14px 0 6px; }
  textarea {
    width: 100%; min-height: 92px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wc { font-family: "Noto Sans", system-ui, sans-serif; font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  .mine { font-family: "Noto Serif", serif; background: var(--soft); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; margin-bottom: 8px; }
  .checklist label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .checklist input { margin-top: 4px; width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
  .expl-list { margin: 6px 0 0; padding-left: 1.3em; }
  .expl-list li { margin-bottom: 6px; }
  .dset { margin: 12px 0 !important; }
  .dset-item { display: grid; grid-template-columns: 2.1em 1fr; margin: 0 0 10px; }
  .dset-tag { grid-row: span 9; }
  .dset-line { display: grid; grid-template-columns: 1.8em 1fr; gap: 0 4px; margin: 0; }
  .dset-line .who { font-weight: 700; }
  .box.task { padding-top: 16px; }
  .mc-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .mc-opt {
    font: inherit; text-align: left; display: flex; gap: 10px; align-items: baseline;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 8px; padding: 10px 14px; cursor: pointer;
  }
  .mc-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); box-shadow: inset 0 0 0 1px var(--accent); }
  .mc-opt .mk { font-weight: 700; flex: none; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    .paper { padding: 22px 14px 18px; }
    body { font-size: 16px; }
    .pairs { padding-left: 0.5em; gap: 2px 10px; }
  }
</style>

<script>
const ITEMS = [
 {
  "key": "01",
  "label": "1",
  "type": "cases",
  "short": "Stress and the syllabification of -st-",
  "points": 2,
  "instruction": "Read the passage and follow the directions.",
  "passage": [
   { "type": "p", "html": "It is a general pattern in English that nouns of three or more syllables carry primary stress on the antepenultimate syllable (the third syllable from the end) when the penultimate syllable is light, as shown below:" },
   { "type": "data", "tag": "(1)", "title": "antepenultimate syllable stressed",
     "rows": [ { "forms": "elephant, syllabus, Victoria, cinnamon, cafeteria" } ] },
   { "type": "p", "html": "When the penultimate syllable is instead heavy — closed by a consonant, or containing a long vowel or diphthong — primary stress shifts to that heavy syllable:" },
   { "type": "data", "tag": "(2)", "title": "penultimate syllable stressed",
     "rows": [
       { "sub": "a.", "forms": "incentive, consensus, ellipsis" },
       { "sub": "b.", "forms": "potato, piano, volcano" }
     ] },
   { "type": "p", "html": "In (2a), the word-internal sequences <i>-nt-</i> (incentive), <i>-ns-</i> (consensus), <i>-ps-</i> (ellipsis) are not possible onsets in English, so the syllable boundary must separate the two consonants, with the first consonant closing the penultimate syllable and making it heavy." },
   { "type": "p", "html": "The sequence <i>-st-</i> again behaves differently, since it is a legitimate English onset (student, stupid) as well as a legitimate coda (cost, list). A word-internal <i>-st-</i>, therefore, could in principle belong entirely to the onset of the following syllable, leaving the penultimate syllable light, or it could split so that the <i>s</i> closes the penultimate syllable, leaving the syllable heavy. Phonotactics alone cannot tell us which parse is correct." }
  ],
  "cases": [
   {
    "label": "Case A",
    "directions": "Fill in the blank with the ONE most appropriate word from the passage above.",
    "frame": "Considering where primary stress falls in the words given in (3), each of which contains the sequence <i>-st-</i>, we can claim that the underlined <i>s</i> belongs to the {1} of the syllable that follows it.",
    "data": { "tag": "(3)", "title": "antepenultimate syllable stressed",
      "forms": ["trave<u>s</u>ty", "dyna<u>s</u>ty", "ance<u>s</u>tor"] },
    "answers": { "1": ["onset"] },
    "explanation": "Stress falls on the antepenult, so the penult must be light. The whole -st- cluster therefore begins the following syllable: tra.ve.sty, dy.na.sty, an.ce.stor."
   },
   {
    "label": "Case B",
    "directions": "Fill in the blank with the ONE most appropriate word from the passage above.",
    "frame": "Considering where primary stress falls in the words given in (4), each of which contains the sequence <i>-st-</i>, we can claim that the underlined <i>s</i> belongs to the {1} of the syllable that precedes it.",
    "data": { "tag": "(4)", "title": "penultimate syllable stressed",
      "forms": ["resi<u>s</u>tance", "inve<u>s</u>tment", "combu<u>s</u>tion"] },
    "answers": { "1": ["coda"] },
    "explanation": "Stress falls on the penult, so the penult must be heavy. The s closes that syllable and the cluster splits: re.sis.tance, in.vest.ment, com.bus.tion."
   }
  ]
 },
 {
  "key": "02",
  "label": "2",
  "type": "classify",
  "short": "Stress rules for three-syllable verbs and nouns",
  "points": 4,
  "instruction": "Read &lt;A&gt; and find TWO words in &lt;B&gt; for each of the stress rules (1)-①, (1)-②, (2)-①, and (2)-②. Write their letters. (Consider only the conditions of the stress rules given in &lt;A&gt;.)",
  "passage": [
   { "type": "p", "html": "Stress placement in English words is governed by rules that are sensitive to several kinds of information: what grammatical category the word belongs to, how many syllables it has, and how the syllables are phonologically structured. The two rules below apply specifically to three-syllable words." },
   { "type": "data", "tag": "(1)", "title": "In three-syllable verbs,",
     "rows": [
       { "sub": "①", "forms": "if the final syllable is strong, then it is stressed;" },
       { "sub": "②", "forms": "if the final syllable is weak, then it is unstressed, and stress is placed on the preceding syllable if that syllable is strong." }
     ] },
   { "type": "data", "tag": "(2)", "title": "In three-syllable nouns,",
     "rows": [
       { "sub": "①", "forms": "if the final syllable is weak, or ends with [oʊ], then it is unstressed; if the syllable preceding this final syllable is strong, then that middle syllable is stressed;" },
       { "sub": "②", "forms": "if the second and third syllables are both weak, then the first syllable is stressed." }
     ] },
   { "type": "note", "html": "<b>Note:</b> A strong syllable has a rhyme which either has a syllable peak which is a long vowel or diphthong, or a vowel followed by a coda (i.e., one or more consonants). Weak syllables have a syllable peak which is a short vowel, and no coda unless the syllable peak is [ə]." }
  ],
  "box": [
   { "label": "a", "form": "agenda" },
   { "label": "b", "form": "apprehend" },
   { "label": "c", "form": "animal" },
   { "label": "d", "form": "consider" },
   { "label": "e", "form": "camera" },
   { "label": "f", "form": "circumvent" },
   { "label": "g", "form": "tomato" },
   { "label": "h", "form": "surrender" }
  ],
  "rows": [
   { "rule": "(1)-①", "answers": ["b", "f"],
     "explanation": "Verbs with a strong (closed) final syllable, which is stressed: appreˈhend, circumˈvent." },
   { "rule": "(1)-②", "answers": ["d", "h"],
     "explanation": "Verbs with a weak final syllable (-der [dɚ]) and a strong middle syllable, which takes the stress: conˈsider, surˈrender." },
   { "rule": "(2)-①", "answers": ["a", "g"],
     "explanation": "Nouns whose final syllable is weak (-da) or ends in [oʊ] (-to), with a strong middle syllable: aˈgenda, toˈmato." },
   { "rule": "(2)-②", "answers": ["c", "e"],
     "explanation": "Nouns whose second and third syllables are both weak, so the first is stressed: ˈanimal, ˈcamera." }
  ]
 },
 {
  "key": "03",
  "label": "3",
  "type": "fill",
  "short": "Trisyllabic laxing and derivation",
  "points": 2,
  "instruction": "Read the passage and fill in the blank with ONE word.",
  "passage": [
   { "type": "p", "html": "Trisyllabic laxing is a phonological rule that turns a tense vowel into its lax counterpart. The rule targets a vowel that comes to sit in the antepenultimate syllable (that is, the third syllable counting from the end of the word) as a result of a suffix being attached to a base word, as shown in the pairs below." },
   { "type": "pairs",
     "rows": [
       ["serene", "serenity"],
       ["extreme", "extremity"],
       ["profound", "profundity"],
       ["obscene", "obscenity"],
       ["grave", "gravity"]
     ] },
   { "type": "p", "html": "Words such as ‘dinosaur’ and ‘cyanide’ also have a tense vowel sitting in the antepenultimate syllable, and both words have (at least) the three syllables the rule requires. Even so, trisyllabic laxing does not apply to the antepenultimate vowel of either word. This is because neither word is derived from a smaller base word by attaching any {1}." }
  ],
  "answers": { "1": ["suffix", "suffixes"] },
  "explanation": "Trisyllabic laxing is triggered by suffixation: the tense vowel ends up in the antepenult only because a suffix like -ity is added to a base (serene → serenity). ‘Dinosaur’ and ‘cyanide’ are single morphemes with no base + suffix structure, so the rule has no environment to apply in, and their tense vowels stay tense."
 },
 {
  "key": "04",
  "label": "4",
  "type": "fill+box",
  "short": "Ambisyllabicity and syllable weight",
  "points": 4,
  "numberBlanks": true,
  "instruction": "Read the passage and follow the directions.",
  "passage": [
   { "type": "p", "html": "In many English words, primary stress is sensitive to syllable weight: a stressed syllable is generally heavy, where a heavy syllable is one whose vowel is long or a diphthong, or whose vowel is followed by at least one coda consonant. A syllable consisting of a short (lax) vowel with no coda is light, and a light syllable cannot normally bear primary stress on its own." },
   { "type": "p", "html": "By the principle of onset maximization, a single consonant between two vowels is normally assigned to the onset of the following syllable. Most accounts therefore syllabify <i>classic</i> as [ˈklæ.sɪk], with [s] beginning the second syllable. On this parse, however, the stressed first syllable contains only a short vowel and no coda, an apparently light syllable." },
   { "type": "p", "html": "Interestingly, some native speakers have a different intuition. They feel that the [s] also ends the first syllable, as if the word were divided [ˈklæs.sɪk], which makes the stressed syllable feel closed. These speakers cannot be hearing two separate [s] sounds, since English does not allow geminates within a single morpheme; a sequence of two identical consonants arises only across a morpheme boundary, as in <i>misspell</i>." },
   { "type": "p", "html": "The intuition can be accounted for if the single consonant after the stressed vowel belongs simultaneously to two syllables: it functions as the coda of the stressed syllable and, at the same time, as the onset of the syllable that follows. A consonant with this double syllabic membership is called {1}. Because this consonant also closes the stressed syllable, that syllable counts as heavy after all, which is why primary stress can fall there. The same analysis applies to the words in (1), where writing the shared consonant twice represents one consonant, not two." },
   { "type": "data", "tag": "(1)",
     "rows": [ { "forms": "classic [ˈklæs.sɪk], happy [ˈhæp.pi], lemon [ˈlɛm.mən], study [ˈstʌd.di]" } ] }
  ],
  "blankDirections": "Fill in blank ① in &lt;A&gt; with ONE word.",
  "answers": { "1": ["ambisyllabic"] },
  "blankPoints": 2,
  "box": [
   { "label": "a", "form": "coffee" },
   { "label": "b", "form": "baker" },
   { "label": "c", "form": "visit" },
   { "label": "d", "form": "window" }
  ],
  "boxDirections": "Based on &lt;A&gt;, choose the TWO words in &lt;B&gt; whose stressed syllable is heavy only because of an ambisyllabic consonant, just like the words in (1).",

const CIRC = { "1": "①", "2": "②", "3": "③", "4": "④" };
const state = {};

function getState(key) {
  if (!state[key]) state[key] = { blanks: {}, choice: [], rows: {}, pick: null, reason: "", self: {}, feedback: false };
  return state[key];
}

function escAttr(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }
function escText(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function norm(s) { return String(s || "").toLowerCase().replace(/[\s.,;:!?'"()]+/g, " ").trim(); }
function wordCount(s) { return String(s || "").trim().split(/\s+/).filter(Boolean).length; }
function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

function blankInput(id, n, item, st) {
  const num = item.numberBlanks ? `<span class="num">${CIRC[n]}</span>` : "";
  return `${num}<input type="text" class="blank-in" data-blank="${id}" aria-label="Blank ${CIRC[n]}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escAttr(st.blanks[id] || "")}">`;
}
function fillBlanks(html, prefix, item, st) {
  return html.replace(/\{(\d)\}/g, (_, n) => blankInput(prefix + n, n, item, st));
}

function dataBlock(b) {
  let h = "";
  if (!b.title && b.rows.length === 1 && !b.rows[0].sub) {
    return `<p class="data"><span class="tag">${b.tag}</span>${b.rows[0].forms}</p>`;
  }
  h += `<p class="data"><span class="tag">${b.tag}</span>${b.title || ""}</p>`;
  b.rows.forEach(r => {
    if (r.sub) h += `<p class="data-sub hang"><span class="sl">${r.sub}</span>${r.forms}</p>`;
    else h += `<p class="data-sub">${r.forms}</p>`;
  });
  return h;
}

function passageHTML(item, st) { return blocksHTML(item.passage, item, st); }

function blocksHTML(blocks, item, st) {
  let h = "";
  blocks.forEach(b => {
    if (b.type === "p") h += `<p class="indent">${fillBlanks(b.html, "", item, st)}</p>`;
    else if (b.type === "note") h += `<p class="note">${b.html}</p>`;
    else if (b.type === "data") h += dataBlock(b);
    else if (b.type === "dialog") {
      h += `<div class="dialog"><p class="dlg-context">${b.context}</p>`;
      b.lines.forEach(l => { h += `<p class="dlg-row"><span class="who">${l.who}</span><span>${l.html}</span></p>`; });
      h += `</div>`;
    }
    else if (b.type === "dlgset") {
      h += `<div class="dset">`;
      b.items.forEach(it => {
        h += `<div class="dset-item"><span class="dset-tag">${it.tag || ""}</span><div>`;
        it.lines.forEach(l => { h += `<p class="dset-line"><span class="who">${l.who}</span><span>${fillBlanks(l.html, "", item, st)}</span></p>`; });
        h += `</div></div>`;
      });
      h += `</div>`;
    }
    else if (b.type === "pairs") {
      h += `<div class="pairs">`;
      b.rows.forEach(([x, y]) => { h += `<span>${x}</span><span>—</span><span>${y}</span>`; });
      h += `</div>`;
    }
  });
  return h;
}

function boxB(item) {
  let h = `<section class="box" aria-label="Box B"><span class="box-label">&lt;B&gt;</span>${item.boxIntro ? `<p class="indent">${item.boxIntro}</p>` : ""}<div class="options">`;
  item.box.forEach(o => { h += `<div>(${o.label}) ${o.form}</div>`; });
  return h + `</div></section>`;
}

function render() {
  const idx = Number(document.getElementById("qselect").value);
  const item = ITEMS[idx];
  const st = getState(item.key);
  const paper = document.getElementById("paper");

  let h = `<div class="qhead"><span class="q"><span class="qnum">${item.label}.</span>${item.instruction}</span>${item.points ? `<span class="pts">[${item.points} points]</span>` : ""}</div>`;
  h += `<section class="box" aria-label="Passage A"><span class="box-label">&lt;A&gt;</span>${passageHTML(item, st)}</section>`;
  if (item.taskBox) h += `<section class="box task" aria-label="Task">${blocksHTML(item.taskBox, item, st)}</section>`;

  h += `<div class="directions">`;
  if (item.type === "cases") {
    item.cases.forEach((c, i) => {
      h += `<div class="case"><p class="step-title">${c.label}</p><p>${c.directions}</p>`;
      h += `<div class="frame">${fillBlanks(c.frame, "c" + i + "-", item, st)}</div>`;
      h += `<div class="case-data"><p class="data"><span class="tag">${c.data.tag}</span>${c.data.title}</p>`;
      c.data.forms.forEach(f => { h += `<p class="data-sub">${f}</p>`; });
      h += `</div></div>`;
    });
  } else if (item.type === "classify") {
    h += boxB(item);
    h += `<div class="answer-table" role="group" aria-label="Answer table"><div class="at-head">${item.rowsHint || "Choose TWO letters for each rule."}</div>`;
    item.rows.forEach((r, i) => {
      const picked = st.rows[i] || [];
      h += `<div class="at-row"><span class="at-rule">${r.rule}</span><span class="at-chips">`;
      item.box.forEach(o => {
        h += `<button type="button" class="chip sm" data-row="${i}" data-letter="${o.label}" aria-pressed="${picked.includes(o.label)}" aria-label="${r.rule}: ${o.label}">${o.label}</button>`;
      });
      h += `</span></div>`;
    });
    h += `</div>`;
  } else if (item.type === "fill+box") {
    h += boxB(item);
    h += `<div class="case"><p class="step-title">Blank ①</p><p>${item.blankDirections}</p></div>`;
    h += `<div class="case"><p class="step-title">&lt;B&gt;</p><p>${item.boxDirections}</p>`;
    h += `<div class="choice-row" role="group" aria-label="Choose two words in B"><span>Your choice:</span>`;
    item.box.forEach(o => {
      h += `<button type="button" class="chip" data-choice="${o.label}" aria-pressed="${st.choice.includes(o.label)}">${o.label}</button>`;
    });
    h += `</div></div>`;
  } else if (item.type === "mc") {
    h += `<div class="case"><p>${item.prompt}</p><div class="mc-list" role="group" aria-label="Choices">`;
    item.options.forEach(o => {
      h += `<button type="button" class="mc-opt" data-mc="${o.k}" aria-pressed="${st.pick === o.k}"><span class="mk">${o.k}</span><span>${o.html}</span></button>`;
    });
    h += `</div></div>`;
  } else if (item.type === "choose+reason") {
    h += `<div class="case"><p class="step-title">Directions</p><p>${item.directions}</p>`;
    h += `<div class="choice-row" role="group" aria-label="Choose the number"><span>Number:</span>`;
    item.options.forEach(o => {
      h += `<button type="button" class="chip" data-pick="${o}" aria-pressed="${st.pick === o}">(${o})</button>`;
    });
    h += `</div>`;
    if (item.frame) {
      h += `<div class="frame">${fillBlanks(item.frame, "", item, st)}</div></div>`;
    } else {
      h += `<label class="field-label" for="reason">Reason (about ${item.reasonWords[0]}–${item.reasonWords[1]} words)</label>`;
      h += `<textarea id="reason" placeholder="Explain based on the dialog...">${escText(st.reason)}</textarea>`;
      h += `<div class="wc" id="wc">${wordCount(st.reason)} words</div></div>`;
    }
  }
  h += `</div>`;

  h += `<div class="feedback-bar"><button type="button" class="btn primary" id="check">Check my answers</button>`;
  h += `<button type="button" class="btn" id="reset">Reset this question</button></div>`;
  h += `<div class="feedback" id="feedback" hidden></div>`;

  paper.innerHTML = h;
  bind(item, st);
  if (st.feedback) showFeedback(item, st);
  updateNav(idx);
}

function toggle(list, v, max) {
  if (list.includes(v)) return list.filter(x => x !== v);
  const out = list.slice();
  if (out.length >= max) out.shift();
  out.push(v);
  return out;
}

function bind(item, st) {
  const paper = document.getElementById("paper");
  paper.querySelectorAll("input[data-blank]").forEach(inp => {
    inp.addEventListener("input", () => { st.blanks[inp.dataset.blank] = inp.value; });
  });
  paper.querySelectorAll("[data-choice]").forEach(btn => {
    btn.addEventListener("click", () => {
      st.choice = toggle(st.choice, btn.dataset.choice, item.boxAnswer.length);
      paper.querySelectorAll("[data-choice]").forEach(b => b.setAttribute("aria-pressed", st.choice.includes(b.dataset.choice)));
    });
  });
  paper.querySelectorAll("[data-row]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = btn.dataset.row;
      st.rows[i] = toggle(st.rows[i] || [], btn.dataset.letter, item.rows[i].answers.length);
      paper.querySelectorAll(`[data-row="${i}"]`).forEach(b => b.setAttribute("aria-pressed", st.rows[i].includes(b.dataset.letter)));
    });
  });
  paper.querySelectorAll("[data-mc]").forEach(btn => {
    btn.addEventListener("click", () => {
      st.pick = st.pick === btn.dataset.mc ? null : btn.dataset.mc;
      paper.querySelectorAll("[data-mc]").forEach(b => b.setAttribute("aria-pressed", st.pick === b.dataset.mc));
    });
  });
  paper.querySelectorAll("[data-pick]").forEach(btn => {
    btn.addEventListener("click", () => {
      st.pick = st.pick === btn.dataset.pick ? null : btn.dataset.pick;
      paper.querySelectorAll("[data-pick]").forEach(b => b.setAttribute("aria-pressed", st.pick === b.dataset.pick));
    });
  });
  const reason = document.getElementById("reason");
  if (reason) reason.addEventListener("input", () => {
    st.reason = reason.value;
    document.getElementById("wc").textContent = `${wordCount(st.reason)} words`;
  });
  document.getElementById("check").addEventListener("click", () => {
    st.feedback = true;
    showFeedback(item, st);
    document.getElementById("feedback").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  document.getElementById("reset").addEventListener("click", () => {
    delete state[item.key];
    render();
  });
}

function blankOK(given, accepted) {
  const g = norm(given);
  return g !== "" && accepted.map(norm).includes(g);
}

function blankRow(label, given, accepted) {
  const ok = blankOK(given, accepted);
  const g = String(given || "").trim();
  let h = `<div class="fb-row ${ok ? "ok" : "bad"}"><span class="verdict">${label} ${ok ? "Correct" : (g ? "Incorrect" : "Not answered")}</span>`;
  h += `<span>Your answer: ${g ? escText(g) : "—"}</span>`;
  if (!ok) h += `<span class="muted">Answer: ${accepted.join(" or ")}</span>`;
  return { ok, html: h + `</div>` };
}

function letterRow(label, picked, answer, perLetter) {
  const hits = picked.filter(x => answer.includes(x)).length;
  const full = hits === answer.length;
  const cls = full ? "ok" : (hits > 0 ? "partial" : "bad");
  const verdict = full ? "Correct" : (picked.length === 0 ? "Not answered" : (hits > 0 ? "Partly correct" : "Incorrect"));
  const got = [...picked].sort().join(", ");
  let h = `<div class="fb-row ${cls}"><span class="verdict">${label} ${verdict}</span>`;
  h += `<span>Your choice: ${got || "—"}</span>`;
  if (!full) h += `<span class="muted">Answer: ${[...answer].sort().join(", ")}</span>`;
  h += `<span class="muted">(${fmt(hits * perLetter)} pt)</span>`;
  return { full, score: hits * perLetter, html: h + `</div>` };
}

function explSection(item) {
  if (item.explanationList) {
    let h = `<div class="fb-section"><h3>Explanation</h3><div class="expl-text"><ul class="expl-list">`;
    item.explanationList.forEach(e => { h += `<li>${e}</li>`; });
    return h + `</ul></div></div>`;
  }
  return `<div class="fb-section"><h3>Explanation</h3><div class="expl-text">${item.explanation}</div></div>`;
}

function expl(text, open) {
  return `<details class="expl"${open ? " open" : ""}><summary>Explanation</summary><div class="expl-body">${text}</div></details>`;
}

function showFeedback(item, st) {
  const fb = document.getElementById("feedback");
  let score = 0;
  let body = "";

  if (item.type === "cases") {
    const per = item.points / item.cases.length;
    body += `<div class="fb-section"><h3>Answers</h3>`;
    item.cases.forEach((c, i) => {
      Object.keys(c.answers).forEach(n => {
        const r = blankRow(c.label, st.blanks["c" + i + "-" + n], c.answers[n]);
        if (r.ok) score += per;
        body += r.html + expl(c.explanation, !r.ok);
      });
    });
    body += `</div>`;
  } else if (item.type === "classify") {
    body += `<div class="fb-section"><h3>Answer table</h3>`;
    item.rows.forEach((r, i) => {
      const per = item.points / item.rows.length / r.answers.length;
      const res = letterRow(r.rule, st.rows[i] || [], r.answers, per);
      score += res.score;
      body += res.html + expl(r.explanation, !res.full);
    });
    body += `</div>`;
  } else if (item.type === "fill") {
    const keys = Object.keys(item.answers);
    body += `<div class="fb-section"><h3>${keys.length > 1 ? "Blanks" : "Blank"}</h3>`;
    keys.forEach(n => {
      const r = blankRow(item.numberBlanks ? CIRC[n] : "", st.blanks[n], item.answers[n]);
      if (r.ok) score += item.blankPoints ? item.blankPoints[n] : item.points / keys.length;
      body += r.html;
    });
    body += `</div>`;
    body += explSection(item);
  } else if (item.type === "mc") {
    const ok = st.pick === item.answer;
    body += `<div class="fb-section"><h3>Answer</h3>`;
    body += `<div class="fb-row ${ok ? "ok" : "bad"}"><span class="verdict">${ok ? "Correct" : (st.pick ? "Incorrect" : "Not answered")}</span>`;
    body += `<span>Your answer: ${st.pick || "—"}</span>`;
    if (!ok) body += `<span class="muted">Answer: ${item.answer}</span>`;
    body += `</div></div>`;
    body += explSection(item);
  } else if (item.type === "fill+box") {
    body += `<div class="fb-section"><h3>Blank</h3>`;
    const r = blankRow("①", st.blanks["1"], item.answers["1"]);
    if (r.ok) score += item.blankPoints;
    body += r.html + `</div>`;
    body += `<div class="fb-section"><h3>&lt;B&gt;</h3>`;
    const res = letterRow("", st.choice, item.boxAnswer, item.boxPoints / item.boxAnswer.length);
    score += res.score;
    body += res.html + `</div>`;
    body += `<div class="fb-section"><h3>Explanation</h3><div class="expl-text">${item.explanation}</div></div>`;
  } else if (item.type === "choose+reason") {
    const ok = st.pick === item.answer;
    if (ok) score += item.numberPoints;
    body += `<div class="fb-section"><h3>Number</h3>`;
    body += `<div class="fb-row ${ok ? "ok" : "bad"}"><span class="verdict">${ok ? "Correct" : (st.pick ? "Incorrect" : "Not answered")}</span>`;
    body += `<span>Your answer: ${st.pick ? "(" + st.pick + ")" : "—"}</span>`;
    if (!ok) body += `<span class="muted">Answer: (${item.answer})</span>`;
    body += `<span class="muted">(${fmt(ok ? item.numberPoints : 0)} pt)</span></div></div>`;

    if (item.frame) {
      body += `<div class="fb-section"><h3>Blank</h3>`;
      Object.keys(item.answers).forEach(n => {
        const r = blankRow(CIRC[n], st.blanks[n], item.answers[n]);
        if (r.ok) score += item.blankPoints;
        body += r.html;
      });
      body += `</div>`;
    } else {
    const text = st.reason.trim();
    const wc = wordCount(text);
    const per = item.reasonPoints / item.criteria.length;
    body += `<div class="fb-section"><h3>Reason (self-check)</h3>`;
    if (text) {
      const [lo, hi] = item.reasonWords;
      const note = wc < lo ? " — a little short" : (wc > hi ? " — a little long" : "");
      body += `<div class="mine">${escText(text)}</div><p class="muted">${wc} words${note}. Tick each point your reason covers (${fmt(per)} pt each).</p>`;
      body += `<div class="checklist">`;
      item.criteria.forEach((c, i) => {
        if (st.self[i]) score += per;
        body += `<label><input type="checkbox" data-crit="${i}"${st.self[i] ? " checked" : ""}><span>${c}</span></label>`;
      });
      body += `</div>`;
    } else {
      body += `<div class="fb-row bad"><span class="verdict">Not answered</span><span class="muted">(0 pt)</span></div>`;
    }
    body += `</div>`;
    body += `<div class="fb-section"><h3>Sample reason</h3><div class="expl-text">${item.sampleReason}</div></div>`;
    }
    body += `<div class="fb-section"><h3>Explanation</h3><div class="expl-text"><ul class="expl-list">`;
    item.explanationList.forEach(e => { body += `<li>${e}</li>`; });
    body += `</ul></div></div>`;
  }

  fb.innerHTML = (item.points ? `<div class="score">Score: ${fmt(score)} / ${item.points} points</div>` : "") + body;
  fb.hidden = false;
  fb.querySelectorAll("[data-crit]").forEach(cb => {
    cb.addEventListener("change", () => { st.self[cb.dataset.crit] = cb.checked; showFeedback(item, st); });
  });
}

function updateNav(idx) {
  document.getElementById("prev").disabled = idx === 0;
  document.getElementById("next").disabled = idx === ITEMS.length - 1;
}

(function init() {
  const sel = document.getElementById("qselect");
  ITEMS.forEach((it, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = `Question ${it.label} — ${it.short}`;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => { render(); window.scrollTo({ top: 0 }); });
  document.getElementById("prev").addEventListener("click", () => { sel.value = Math.max(0, Number(sel.value) - 1); render(); window.scrollTo({ top: 0 }); });
  document.getElementById("next").addEventListener("click", () => { sel.value = Math.min(ITEMS.length - 1, Number(sel.value) + 1); render(); window.scrollTo({ top: 0 }); });
  render();
})();
</script>
</body>
