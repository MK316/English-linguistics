<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonology Terminology Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Noto+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4ef; --paper: #ffffff; --ink: #1b1b1b; --muted: #5d5a54; --line: #d9d4ca;
    --accent: #1f4e8c; --accent-ink: #ffffff; --soft: #eef2f8; --mark: #fff1b8;
    --ok: #1d7a46; --ok-bg: #e7f5ec; --bad: #b3261e; --bad-bg: #fbeceb; --blank-bg: #fbf7e8; --mask: #e4e0d8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --line: #3a3a3a;
      --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a; --mark: #5a4a12;
      --ok: #6fd39a; --ok-bg: #16301f; --bad: #f2928b; --bad-bg: #3a1c1a; --blank-bg: #2c2817; --mask: #3a3733;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151515; --paper: #1f1f1f; --ink: #ececec; --muted: #a7a39b; --line: #3a3a3a;
    --accent: #7fa8e6; --accent-ink: #0e1a2b; --soft: #22293a; --mark: #5a4a12;
    --ok: #6fd39a; --ok-bg: #16301f; --bad: #f2928b; --bad-bg: #3a1c1a; --blank-bg: #2c2817; --mask: #3a3733;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 4px 8px 32px; }
  h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .sub a { color: var(--accent); font-weight: 600; }
  .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 18px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  label.lbl { color: var(--muted); font-size: 0.92rem; }
  select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; flex: 1 1 220px; max-width: 100%; }
  .termgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 16px; margin: 16px 0 4px; }
  .termgrid label { display: flex; gap: 8px; align-items: flex-start; font-size: 0.93rem; cursor: pointer; padding: 4px 2px; }
  .termgrid input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; flex: none; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 1.8em; }
  .btn { font: inherit; font-weight: 600; font-size: 0.93rem; border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--paper); color: var(--accent); }
  .btn.primary, .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .btn.small { padding: 6px 12px; font-size: 0.85rem; border-color: var(--line); color: var(--ink); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn:focus-visible, select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .count { color: var(--muted); font-size: 0.88rem; margin-left: auto; }
  .modes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .card { margin-top: 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 24px 22px; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
  .front { font-family: "Noto Serif", serif; font-size: 1.5rem; font-weight: 700; text-align: center; padding: 26px 8px; }
  .text { font-family: "Noto Serif", serif; font-size: 1.04rem; line-height: 1.9; }
  mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; font-weight: 700; }
  .masked { display: inline-block; min-width: 3.2em; height: 0.9em; background: var(--mask); border-radius: 3px; vertical-align: middle; }
  .kw { white-space: normal; }
  .kw input {
    font: inherit; color: var(--ink); background: var(--blank-bg); border: none; border-bottom: 1.5px solid var(--ink);
    border-radius: 0; padding: 0 4px; margin: 0 3px; text-align: center; max-width: 100%;
  }
  .kw input.ok { background: var(--ok-bg); border-bottom-color: var(--ok); }
  .kw input.bad { background: var(--bad-bg); border-bottom-color: var(--bad); }
  .words { font-family: "Noto Sans", sans-serif; font-size: 0.7rem; color: var(--accent); vertical-align: super; margin-left: 2px; }
  .given { font-weight: 700; }
  .fix { font-family: "Noto Sans", sans-serif; font-size: 0.8rem; color: var(--bad); margin-left: 3px; }
  .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; align-items: center; }
  .result { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 0.93rem; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.bad { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); font-size: 0.93rem; margin-top: 14px; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) { .card { padding: 18px 14px; } .front { font-size: 1.25rem; } }
  body { background: transparent; }
</style>
</head>

makes the word sound non-native."}]}, {"n": 4, "label": "alternation", "segs": [{"t": "text", "x": "An "}, {"t": "kw", "x": "alternation", "parts": [{"t": "blank", "a": "alternation", "hint": false}]}, {"t": "text", "x": " is a systematic variation in the form of a morpheme depending on its environment. The plural suffix alternates among [s] (cats), [z] (dogs), and [ɪz] (buses), and the root of electric with [k] alternates with electricity with [s]. Phonologists analyze alternations by positing one underlying form and rules that derive the different surface forms."}]}, {"n": 5, "label": "alveolar", "segs": [{"t": "text", "x": "An "}, {"t": "kw", "x": "alveolar", "parts": [{"t": "blank", "a": "alveolar", "hint": false}]}, {"t": "text", "x": " consonant is made with the tongue tip or blade against the alveolar ridge, the bony ridge just behind the upper front teeth. English alveolars are /t d s z n l/ and, for many speakers, /ɹ/, as in tin, din, sin, zip, nip, and lip. Alveolars are the most frequent consonants in English, and some patterns single them out: only an alveolar nasal may precede a voiced stop in a coda (hand, but not *[hæmb])."}]}, {"n": 6, "label": "ambisyllabicity", "segs": [{"t": "kw", "x": "Ambisyllabicity", "parts": [{"t": "blank", "a": "Ambisyllabicity", "hint": false}]}, {"t": "text", "x": " is the property of a consonant that belongs to two syllables at once, serving as the coda of one and the onset of the next. In happy and city, the medial consonant follows a stressed lax vowel, which needs a coda, and precedes a vowel, which attracts an onset. Treating [p] or [t] as "}, {"t": "kw", "x": "ambisyllabic", "parts": [{"t": "blank", "a": "ambisyllabic", "hint": false}]}, {"t": "text", "x": " satisfies both demands and helps explain flapping in American English city [ˈsɪɾi]."}]}, {"n": 7, "label": "aspiration", "segs": [{"t": "kw", "x": "Aspiration", "parts": [{"t": "blank", "a": "Aspiration", "hint": false}]}, {"t": "text", "x": " is the puff of breath that follows the release of a voiceless stop before voicing begins, written with a superscript [ʰ]. In English, /p t k/ are aspirated at the beginning of a stressed syllable, as in pin [pʰɪn] and attack [əˈtʰæk], but unaspirated after /s/, as in spin [spɪn]. Aspiration is allophonic in English but phonemic in languages such as Korean and Hindi."}]}, {"n": 8, "label": "assimilation (vs. dissimilation)", "segs": [{"t": "kw", "x": "Assimilation", "parts": [{"t": "blank", "a": "Assimilation", "hint": false}]}, {"t": "text", "x": " is a process in which a sound becomes more like a neighboring sound. The prefix in- becomes [ɪm] in impossible and [ɪŋ] in incomplete (place assimilation), and the plural suffix is voiced [z] in dogs (voicing assimilation). "}, {"t": "kw", "x": "Dissimilation", "parts": [{"t": "blank", "a": "Dissimilation", "hint": false}]}, {"t": "text", "x": " is the opposite process, in which a sound becomes less like a nearby sound: Latin peregrinus, with two r's, became English pilgrim, and many speakers pronounce February as [ˈfɛbjuɛri]."}]}, {"n": 9, "label": "bilabial (labial, labial-velar, labio-dental)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "bilabial", "parts": [{"t": "blank", "a": "bilabial", "hint": false}]}, {"t": "text", "x": " sound is made with both lips, as in [p b m]. "}, {"t": "kw", "x": "Labial", "parts": [{"t": "blank", "a": "Labial", "hint": false}]}, {"t": "text", "x": " is the broader class of sounds articulated with the lips; it also includes "}, {"t": "kw", "x": "labio-dental", "parts": [{"t": "blank", "a": "labio-dental", "hint": false}]}, {"t": "text", "x": " sounds, made with the lower lip against the upper teeth, such as [f v] in fan and van. A "}, {"t": "kw", "x": "labial-velar", "parts": [{"t": "blank", "a": "labial-velar", "hint": false}]}, {"t": "text", "x": " sound combines a lip constriction with a raised tongue back: English [w] in we is a labial-velar approximant."}]}, {"n": 10, "label": "clear 'l' (vs. dark 'l')", "segs": [{"t": "text", "x": "English /l/ has two main allophones. A "}, {"t": "kw", "x": "clear 'l'", "parts": [{"t": "blank", "a": "clear", "hint": false}, {"t": "given", "x": "'l'"}]}, {"t": "text", "x": " [l], with the tongue body fronted, occurs before vowels, as in leaf and light. A "}, {"t": "kw", "x": "dark 'l'", "parts": [{"t": "blank", "a": "dark", "hint": false}, {"t": "given", "x": "'l'"}]}, {"t": "text", "x": " [ɫ], with the back of the tongue raised toward the velum, occurs at the end of a syllable, as in feel, milk, and bottle. Because the difference is allophonic, the two never distinguish words in English."}]}, {"n": 11, "label": "closed syllable (vs. open syllable)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "closed syllable", "parts": [{"t": "blank", "a": "closed", "hint": false}, {"t": "given", "x": "syllable"}]}, {"t": "text", "x": " ends in one or more consonants, as in cat, help, and the first syllable of win.ter. An "}, {"t": "kw", "x": "open syllable", "parts": [{"t": "blank", "a": "open", "hint": false}, {"t": "given", "x": "syllable"}]}, {"t": "text", "x": " ends in a vowel, as in see, go, and the first syllable of ba.by. In English, a stressed lax vowel requires a closed syllable: *[bɪ] is impossible, whereas bee [bi] and bit [bɪt] are both fine."}]}, {"n": 12, "label": "coda", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "coda", "parts": [{"t": "blank", "a": "coda", "hint": false}]}, {"t": "text", "x": " is the part of a syllable that follows the nucleus. In dog the coda is /g/, in text it is /kst/, and in see there is no coda. Together, the nucleus and the coda form the rhyme. Many phonotactic constraints refer to codas: English does not allow /h/ in a coda, and two obstruents in a coda must agree in voicing (kept, not *[kɛbt])."}]}, {"n": 13, "label": "complementary distribution", "segs": [{"t": "text", "x": "Two sounds are in "}, {"t": "kw", "x": "complementary distribution", "parts": [{"t": "blank", "a": ue tip against or between the upper teeth. English has the dental fricatives [θ] in thin and [ð] in this; because the tongue often protrudes, they are also called interdental. English /t d n l/ become dental before /θ/, as in eighth [eɪt̪θ] and tenth [tɛn̪θ], which is marked with the diacritic [ ̪ ]."}]}, {"n": 17, "label": "derivation", "segs": [{"t": "text", "x": "In phonology, a "}, {"t": "kw", "x": "derivation", "parts": [{"t": "blank", "a": "derivation", "hint": false}]}, {"t": "text", "x": " is the step-by-step mapping from an underlying representation to a surface form by applying rules in order. For example, writer /ˈɹaɪtɚ/ becomes [ˈɹaɪɾɚ] in American English when flapping applies to /t/. In morphology, derivation also refers to word formation with affixes that create new words, as in happy → happiness and nation → national."}]}, {"n": 18, "label": "devoiced / devoicing", "segs": [{"t": "kw", "x": "Devoicing", "parts": [{"t": "blank", "a": "Devoicing", "hint": false}]}, {"t": "text", "x": " is the loss of voicing in a sound that is normally voiced. In English, /l ɹ w j/ are "}, {"t": "kw", "x": "devoiced", "parts": [{"t": "blank", "a": "devoiced", "hint": false}]}, {"t": "text", "x": " after aspirated voiceless stops, as in play [pl̥eɪ], try [tɹ̥aɪ], and quick [kw̥ɪk], marked with the diacritic [ ̥ ]. Word-final voiced obstruents are also partly devoiced in English, as in bag; in German this becomes complete final devoicing, so Rad 'wheel' is pronounced [ʁaːt]."}]}, {"n": 19, "label": "diachronic / diachronic changes (vs. synchronic / synchrony)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "diachronic", "parts": [{"t": "blank", "a": "diachronic", "hint": false}]}, {"t": "text", "x": " study examines how a language changes over time, while a "}, {"t": "kw", "x": "synchronic", "parts": [{"t": "blank", "a": "synchronic", "hint": false}]}, {"t": "text", "x": " study describes a language at one point in time. The Great Vowel Shift and the loss of /k/ in knight are "}, {"t": "kw", "x": "diachronic changes", "parts": [{"t": "blank", "a": "diachronic", "hint": false}, {"t": "given", "x": "changes"}]}, {"t": "text", "x": ". A synchronic description of present-day English simply states that knight is /naɪt/ and that /kn/ cannot begin a word. The study of a language as a system at a single point in time is called "}, {"t": "kw", "x": "synchrony", "parts": [{"t": "blank", "a": "synchrony", "hint": false}]}, {"t": "text", "x": "."}]}, {"n": 20, "label": "diphthong (vs. monophthong)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "diphthong", "parts": [{"t": "blank", "a": "diphthong", "hint": false}]}, {"t": "text", "x": " is a vowel whose quality changes within one syllable as the tongue glides from one position to another, as in [aɪ] in my, [aʊ] in now, and [ɔɪ] in boy. A "}, {"t": "kw", "x": "monophthong", "parts": [{"t": "blank", "a": "monophthong", "hint": false}]}, {"t": "text", "x": " keeps a relatively steady quality, as in [i] in see and [æ] in cat. Phonologically, a diphthong counts as a single vowel and behaves like a tense vowel, so it can end an open syllable."}]}, {"n": 21, "label": "dual articulation (secondary articulation)", "segs": [{"t": "text", "x": "A sound with "}, {"t": "kw", "x": "dual articulation", "parts": [{"t": "blank", "a": "dual", "hint": false}, {"t": "given", "x": "articulation"}]}, {"t": "text", "x": " has two constrictions at the same time. In a "}, {"t": "kw", "x": "secondary articulation", "parts": [{"t": "blank", "a": "secondary", "hint": false}, {"t": "given", "x": "articulation"}]}, {"t": "text", "x": ", a weaker constriction accompanies the primary one: English /ʃ ʒ tʃ dʒ/ are often produced with lip rounding, dark [ɫ] is velarized, and Russian has palatalized consonants such as [tʲ]. When both constrictions are equally strong, the sound has a double articulation, as in labial-velar [w] or the West African stop [k͡p]."}]}, {"n": 22, "label": "elision", "segs": [{"t": "kw", "x": "Elision", "parts": [{"t": "blank", "a": "Elision", "hint": false}]}, {"t": "text", "x": " is the omission of a sound in connected or rapid speech. English /t/ and /d/ are often elided between consonants, as in next day [nɛks deɪ] and handbag [ˈhæmbæg], and unstressed vowels may be dropped, as in camera [ˈkæmɹə] and police [pliːs]. Elision reduces articulatory effort but does not change the stored form of the word."}]}, {"n": 23, "label": "elsewhere condition", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "elsewhere condition", "parts": [{"t": "blank", "a": "elsewhere", "hint": true}, {"t": "blank", "a": "condition", "hint": true}]}, {"t": "text", "x": " states that when two rules can apply to the same form, the more specific rule applies and blocks the more general one. In English plurals, the specific rule that adds [ɪz] after sibilants (buses) takes precedence over the general rule that adds [z] elsewhere. Likewise, the listed past tense went blocks the regular form *goed."}]}, {"n": 24, "label": "epenthesis (insertion)", "segs": [{"t": "kw", "x": "Epenthesis", "parts": [{"t": "blank", "a": "Epenthesis", "hint": false}]}, {"t": "text", "x": " is the "}, {"t": "kw", "x": "insertion", "parts": [{"t": "blank", "a": "insertion", "hint": false}]}, {"t": "text", "x": " of a segment into a word. English inserts a vowel in the plural and past tense suffixes to separate similar consonants, as in buses [ˈbʌsɪz] and needed [ˈniːdɪd]. Consonants can also be inserted, as in the [p] that many speakers produce in hamster [ˈhæmpstɚ] or the [t] in prince [pɹɪnts]. Korean speakers who adapt strike as [sɯtʰɯɾaikʰɯ] show vowel epenthesis that fits the native syllable structure."}]}, {"n": 25, "label": "eurhythmy", "segs": [{"t": "kw", "x": "Eurhythmy", "parts": [{"t": "blank", "a": "Eurhythmy", "hint": false}]}, {"t": "text", "x": " is the tendency for stressed and unstressed syllables to alternate regularly, avoiding both stress clashes and long stretches without stress. The Rhythm Rule shows it at work: thirTEEN has final stress in isolation, but in thirteen men the stress shifts to THIRteen MEN to avoid two adjacent stresses. Similarly, JapaNESE becomes JApanese STUdents."}]}, {"n": 26, "label": "extrametrical (extrametricality)", "segs": [{"t": "text", "x": "A syllable is "}, {"t": "kw", "x": "extrametrical", "parts": [{"t": "blank", "a": "extrametrical", "hint": false}]}, {"t": "text", "x": " when the rules that build metrical feet and assign stress ignore it. In English nouns, the final syllable is usually treated as extrametrical; stress then falls on the penultimate syllable if it is heavy (a.GEN.da) or on the antepenult if the penult is light (a.ME.ri.ca). "}, {"t": "kw", "x": "Extrametricality", "parts": [{"t": "blank", "a": "Extrametricality", "hint": false}]}, {"t": "text", "x": " explains why the final syllable of an English noun rarely bears primary stress."}]}, {"n": 27, "label": "feature (binary, major class, unary feature)", "segs": [{"t": "text", "x": "A distinctive "}, {"t": "kw", "x": "feature", "parts": [{"t": "blank", "a": "feature", "hint": false}]}, {"t": "text", "x": " is the smallest phonological property that distinguishes sounds, such as [voice] or [nasal]. A "}, {"t": "kw", "x": "binary feature", "parts": [{"t": "blank", "a": "binary", "hint": false}, {"t": "given", "x": "feature"}]}, {"t": "text", "x": " has two values, so /b/ is [+voice] and /p/ is [−voice]. "}, {"t": "kw", "x": "Major class features", "parts": [{"t": "blank", "a": "major", "hint": true}, {"t": "blank", "a": "class", "hint": true}, {"t": "given", "x": "features"}]}, {"t": "text", "x": ", namely [±consonantal], [±sonorant], and [±syllabic], divide sounds into obstruents, sonorants, glides, and vowels. A "}, {"t": "kw", "x": "unary feature", "parts": [{"t": "blank", "a": "unary", "hint": false}, {"t": "given", "x": "feature"}]}, {"t": "text", "x": " is simply present or absent, with no minus value, as [labial] or [round] in some theories."}]}, {"n": 28, "label": "feature matrix", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "feature matrix", "parts": [{"t": "blank", "a": "feature", "hint": true}, {"t": "blank", "a": "matrix", "hint": true}]}, {"t": "text", "x": " is a set of feature specifications in square brackets that defines a segment or a natural class. The matrix [−sonorant, −continuant, −voice] picks out the natural class /p t k/, while adding [labial] narrows it to /p/. Rules are written with feature matrices so that they apply to whole classes of sounds rather than to individual segments."}]}, {"n": 29, "label": "flap, flapping (cf. tap, tapping)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "flap", "parts": [{"t": "blank", "a": "flap", "hint": false}]}, {"t": "text", "x": " [ɾ] is a very short voiced stop made by a quick flick of the tongue tip against the alveolar ridge. In American English, "}, {"t": "kw", "x": "flapping", "parts": [{"t": "blank", "a": "flapping", "hint": false}]}, {"t": "text", "x": " turns /t/ and /d/ into [ɾ] between a stressed vowel and an unstressed vowel, as in water [ˈwɑɾɚ], city, and ladder, so latter and ladder sound alike. A "}, {"t": "kw", "x": "tap", "parts": [{"t": "blank", "a": "tap", "hint": false}]}, {"t": "text", "x": " is often used as a synonym; strictly, a tap is a direct up-and-down contact while a flap is a sliding stroke, and many textbooks call the same process "}, {"t": "kw", "x": "tapping", "parts": [{"t": "blank", "a": "tapping", "hint": false}]}, {"t": "text", "x": "."}]}, {"n": 30, "label": "foot (feet)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "foot", "parts": [{"t": "blank", "a": "foot", "hint": false}]}, {"t": "text", "x": " is a metrical unit made up of one stressed syllable and any unstressed syllables grouped with it. English words are parsed into "}, {"t": "kw", "x": "feet", "parts": [{"t": "blank", "a": "feet", "hint": false}]}, {"t": "text", "x": " that determine their rhythm: banana is ba(NAna), and Mississippi has two feet, (MIssi)(SSIppi). The foot is also the domain of processes such as flapping and the reduction of unstressed vowels to schwa."}]}, {"n": 31, "label": "free variation", "segs": [{"t": "text", "x": "Two sounds are in "}, {"t": "kw", "x": "free variation", "parts": [{"t": "blank", "a": "free", "hint": true}, {"t": "blank", "a": "variation", "hint": true}]}, {"t": "text", "x": " when they can occur in the same environment without changing meaning. Word-final /p/ in stop may be released [stɑp] or unreleased [stɑp̚], and either may be pronounced [ˈiːðɚ] or [ˈaɪðɚ]. Unlike complementary distribution, free variation does not depend on the phonetic environment but on the speaker, the speech style, or chance."}]}, {"n": 32, "label": "fricative", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "fricative", "parts": [{"t": "blank", "a": "fricative", "hint": false}]}, {"t": "text", "x": " is a consonant produced by forcing air through a narrow channel, which creates turbulent noise. English has nine fricative phonemes: /f v/ (fan, van), /θ ð/ (thin, this), /s z/ (sip, zip), /ʃ ʒ/ (shoe, measure), and /h/ (hat). Fricatives are continuants, because air flows continuously, and obstruents, because the airflow is obstructed."}]}, {"n": 33, "label": "fundamental frequency (pitch)", "segs": [{"t": "kw", "x": "Fundamental frequency", "parts": [{"t": "blank", "a": "fundamental", "hint": true}, {"t": "blank", "a": "frequency", "hint": true}]}, {"t": "text", "x": " (F0) is the rate at which the vocal folds vibrate, measured in hertz. Listeners perceive F0 as "}, {"t": "kw", "x": "pitch", "parts": [{"t": "blank", "a": "pitch", "hint": false}]}, {"t": "text", "x": ": the faster the vibration, the higher the pitch. In English, pitch carries intonation, as in the rise of You're coming? versus the fall of You're coming. In tone languages such as Mandarin, pitch distinguishes words: mā 'mother' versus mǎ 'horse'."}]}, {"n": 34, "label": "geminates (true / fake gemination)", "segs": [{"t": "kw", "x": "Geminates", "parts": [{"t": "blank", "a": "Geminates", "hint": false}]}, {"t": "text", "x": " are long consonants, often analyzed as two identical consonants in sequence, as in Italian fatto [fatto] 'done' versus fato [fato] 'fate'. English has no "}, {"t": "kw", "x": "true gemination", "parts": [{"t": "blank", "a": "true", "hint": false}, {"t": "given", "x": "gemination"}]}, {"t": "text", "x": " within a morpheme; the double letters in happy stand for a single [p]. English has only "}, {"t": "kw", "x": "fake gemination", "parts": [{"t": "blank", "a": "fake", "hint": false}, {"t": "given", "x": "gemination"}]}, {"t": "text", "x": ", in which identical consonants meet across a morpheme or word boundary, as in unnamed [ʌnˈneɪmd] and white teeth."}]}, {"n": 35, "label": "generative phonology", "segs": [{"t": "kw", "x": "Generative phonology", "parts": [{"t": "blank", "a": "generative", "hint": false}, {"t": "given", "x": "phonology"}]}, {"t": "text", "x": " is the approach, formalized in Chomsky and Halle's The Sound Pattern of English (1968), that models a speaker's phonological knowledge as underlying representations plus ordered rules that derive surface forms. For example, the alternation between electric [k] and electricity [s] is captured by one underlying /k/ and a rule that changes it before [ɪ]. Its notation for features and rules is still the basis of most phonology courses."}]}, {"n": 36, "label": "glide", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "glide", "parts": [{"t": "blank", "a": "glide", "hint": false}]}, {"t": "text", "x": " is a sound that is articulated like a vowel but functions as a consonant, occupying the edge of a syllable rather than the nucleus. English has two glides: /j/ in yes, which resembles [i], and /w/ in wet, which resembles [u]. Glides are also called semi-vowels and are [−consonantal, −syllabic] in feature terms."}]}, {"n": 37, "label": "glottal (glottal stop, glottalisation, glottis)", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "glottis", "parts": [{"t": "blank", "a": "glottis", "hint": false}]}, {"t": "text", "x": " is the space between the vocal folds in the larynx. A "}, {"t": "kw", "x": "glottal", "parts": [{"t": "blank", "a": "glottal", "hint": false}]}, {"t": "text", "x": " sound is produced there: English /h/ is a glottal fricative, and the "}, {"t": "kw", "x": "glottal stop", "parts": [{"t": "blank", "a": "glottal", "hint": false}, {"t": "given", "x": "stop"}]}, {"t": "text", "x": " [ʔ] is made by closing the vocal folds completely, as in uh-oh [ˈʌʔoʊ]. "}, {"t": "kw", "x": "Glottalisation", "parts": [{"t": "blank", "a": "Glottalisation", "hint": false}]}, {"t": "text", "x": " is the replacement or reinforcement of a stop by [ʔ], as in button [ˈbʌʔn̩] and Cockney water [ˈwɔːʔə]."}]}, {"n": 38, "label": "heavy syllable (light syllable)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "heavy syllable", "parts": [{"t": "blank", "a": "heavy", "hint": false}, {"t": "given", "x": "syllable"}]}, {"t": "text", "x": " has a branching rhyme, that is, a long vowel or diphthong (CVV) or a short vowel followed by a coda (CVC). A "}, {"t": "kw", "x": "light syllable", "parts": [{"t": "blank", "a": "light", "hint": false}, {"t": "given", "x": "syllable"}]}, {"t": "text", "x": " has a short vowel and no coda (CV). Syllable weight affects English stress: in agenda the penult -gen- is heavy and stressed, whereas in America the penult -ri- is light, so stress falls on the antepenult."}]}, {"n": 39, "label": "heterosyllabic (vs. tautosyllabic)", "segs": [{"t": "text", "x": "Two segments are "}, {"t": "kw", "x": "heterosyllabic", "parts": [{"t": "blank", "a": "heterosyllabic", "hint": false}]}, {"t": "text", "x": " when they belong to different syllables and "}, {"t": "kw", "x": "tautosyllabic", "parts": [{"t": "blank", "a": "tautosyllabic", "hint": false}]}, {"t": "text", "x": " when they belong to the same syllable. In napkin [ˈnæp.kɪn], /p/ and /k/ are heterosyllabic, whereas in apt [æpt] they are tautosyllabic. Many constraints depend on this difference: [ŋg] cannot be tautosyllabic, as *[sɪŋg] shows, but it is fine when heterosyllabic, as in finger [ˈfɪŋ.gɚ]."}]}, {"n": 40, "label": "homophone (homophonous)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "homophone", "parts": [{"t": "blank", "a": "homophone", "hint": false}]}, {"t": "text", "x": " is a word that sounds the same as another word but differs in meaning and often in spelling, such as night and knight, or pair, pear, and pare. Phonological processes can create new homophones: in American English, flapping makes writer and rider nearly "}, {"t": "kw", "x": "homophonous", "parts": [{"t": "blank", "a": "homophonous", "hint": false}]}, {"t": "text", "x": ", and h-dropping in some accents makes hair and air sound alike."}]}, {"n": 41, "label": "homorganic", "segs": [{"t": "text", "x": "Two sounds are "}, {"t": "kw", "x": "homorganic", "parts": [{"t": "blank", "a": "homorganic", "hint": false}]}, {"t": "text", "x": " when they share the same place of articulation. English nasal + stop clusters within a morpheme are homorganic: [mp] in lamp, [nt] in mint, and [ŋk] in sink, while *[mt] and *[nk] do not occur. The prefix in- also becomes homorganic with a following stop, as in impossible [ɪmˈpɑsəbl̩]."}]}, {"n": 42, "label": "iamb / iambic (trochee / trochaic)", "segs": [{"t": "text", "x": "An "}, {"t": "kw", "x": "iamb", "parts": [{"t": "blank", "a": "iamb", "hint": false}]}, {"t": "text", "x": " is a foot in which an unstressed syllable is followed by a stressed one (da-DUM), as in today and forget; such a rhythm is "}, {"t": "kw", "x": "iambic", "parts": [{"t": "blank", "a": "iambic", "hint": false}]}, {"t": "text", "x": ". A "}, {"t": "kw", "x": "trochee", "parts": [{"t": "blank", "a": "trochee", "hint": false}]}, {"t": "text", "x": " is the reverse, a stressed syllable followed by an unstressed one (DUM-da), as in apple and table; such a rhythm is "}, {"t": "kw", "x": "trochaic", "parts": [{"t": "blank", "a": "trochaic", "hint": false}]}, {"t": "text", "x": ". English words are built mostly from trochaic feet, while English verse often uses iambic pentameter: \"Shall I compare thee to a summer's day?\""}]}, {"n": 43, "label": "intonation", "segs": [{"t": "kw", "x": "Intonation", "parts": [{"t": "blank", "a": "Intonation", "hint": false}]}, {"t": "text", "x": " is the use of pitch patterns across a phrase or sentence to convey meanings such as sentence type, focus, or attitude. A falling tone in She's gone. signals a statement, whereas a rising tone in She's gone? signals a question. Intonation also marks focus: in JOHN broke it, the main pitch accent on John contrasts him with other people."}]}, {"n": 44, "label": "intrusive 'r'", "segs": [{"t": "kw", "x": "Intrusive 'r'", "parts": [{"t": "blank", "a": "intrusive", "hint": false}, {"t": "given", "x": "'r'"}]}, {"t": "text", "x": " is an [ɹ] inserted between two vowels in non-rhotic accents even though no r appears in the spelling, as in law and order [ˈlɔːɹənˈɔːdə] and idea of it [aɪˈdɪəɹəvɪt]. It arises by analogy with linking 'r' in words such as car and here, and it typically appears after the vowels [ə ɔː ɑː]."}]}, {"n": 45, "label": "International Phonetic Alphabet (IPA)", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "International Phonetic Alphabet (IPA)", "parts": [{"t": "blank", "a": "international", "hint": true}, {"t": "blank", "a": "phonetic", "hint": true}, {"t": "blank", "a": "alphabet", "hint": true}]}, {"t": "text", "x": " is a standardized set of symbols in which each symbol represents one sound, whatever the language. It allows unambiguous transcription: English though, through, and tough are written [ðoʊ], [θɹuː], and [tʌf]. Square brackets mark phonetic transcription, as in [pʰɪn], while slashes mark phonemic transcription, as in /pɪn/."}]}, {"n": 46, "label": "'l' velarization", "segs": [{"t": "kw", "x": "'l' velarization", "parts": [{"t": "given", "x": "'l'"}, {"t": "blank", "a": "velarization", "hint": false}]}, {"t": "text", "x": " turns English /l/ into dark [ɫ] by raising the back of the tongue toward the velum. It applies in syllable codas, as in feel [fiːɫ] and milk [mɪɫk], and in syllabic /l/, as in bottle [ˈbɑɾɫ̩], but not in onsets, as in leaf [liːf]. Some accents go further and vocalize the dark l, pronouncing milk as [mɪʊk]."}]}, {"n": 47, "label": "lateral", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "lateral", "parts": [{"t": "blank", "a": "lateral", "hint": false}]}, {"t": "text", "x": " is a sound in which air flows along one or both sides of the tongue while the center of the tongue blocks the mouth. English /l/ is a lateral approximant, as in lip and feel, and Welsh has a voiceless lateral fricative [ɬ] in Llanelli. Laterals contrast with central approximants such as English /ɹ/, in which air flows over the middle of the tongue."}]}, {"n": 48, "label": "larynx", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "larynx", "parts": [{"t": "blank", "a": "larynx", "hint": false}]}, {"t": "text", "x": " is the structure of cartilage and muscle at the top of the trachea that houses the vocal folds. It controls voicing by bringing the vocal folds together so that they vibrate, as in [z], or apart so that they do not, as in [s]. Raising or lowering the larynx also affects pitch, and its front is visible in the neck as the Adam's apple."}]}, {"n": 49, "label": "lax vowel (tense vowel)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "lax vowel", "parts": [{"t": "blank", "a": "lax", "hint": false}, {"t": "given", "x": "vowel"}]}, {"t": "text", "x": " is produced with less muscular tension and a more central tongue position than its "}, {"t": "kw", "x": "tense vowel", "parts": [{"t": "blank", "a": "tense", "hint": false}, {"t": "given", "x": "vowel"}]}, {"t": "text", "x": " counterpart: [ɪ] in bit versus [i] in beat, and [ʊ] in book versus [u] in boot. In English, a stressed lax vowel cannot end a syllable, so *[bɪ] is impossible, whereas tense vowels occur in both open and closed syllables (bee, beat)."}]}, {"n": 50, "label": "lenition", "segs": [{"t": "kw", "x": "Lenition", "parts": [{"t": "blank", "a": "Lenition", "hint": false}]}, {"t": "text", "x": " is a weakening process in which a consonant becomes more vowel-like or less obstructed, for example stop → fricative → approximant → zero, or voiceless → voiced. American flapping of /t/ in water and British glottalization of /t/ in butter [ˈbʌʔə] are lenition processes. Spanish shows lenition when /b d g/ become approximants or fricatives between vowels, as in lado [ˈlaðo] 'side'."}]}, {"n": 51, "label": "level of representation (underlying and surface representation)", "segs": [{"t": "text", "x": "Generative phonology distinguishes two "}, {"t": "kw", "x": "levels of representation", "parts": [{"t": "blank", "a": "levels", "hint": true}, {"t": "given", "x": "of"}, {"t": "blank", "a": "representation", "hint": true}]}, {"t": "text", "x": ". The "}, {"t": "kw", "x": "underlying representation", "parts": [{"t": "blank", "a": "underlying", "hint": false}, {"t": "given", "x": "representation"}]}, {"t": "text", "x": " is the stored, abstract form of a morpheme, and the "}, {"t": "kw", "x": "surface representation", "parts": [{"t": "blank", "a": "surface", "hint": false}, {"t": "given", "x": "representation"}]}, {"t": "text", "x": " is its actual pronunciation after the rules have applied. The plural morpheme has one underlying form, /z/, which surfaces as [s] in cats, [z] in dogs, and [ɪz] in buses."}]}, {"n": 52, "label": "lexical rule", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "lexical rule", "parts": [{"t": "blank", "a": "lexical", "hint": false}, {"t": "given", "x": "rule"}]}, {"t": "text", "x": ", in Lexical Phonology, applies inside the lexicon as words are built, often in step with morphology. Lexical rules can refer to morphological structure, may have exceptions, and do not create new kinds of sounds. Trisyllabic laxing, which shortens the vowel in divine [aɪ] → divinity [ɪ] and sane [eɪ] → sanity [æ], is a lexical rule that applies only with certain suffixes."}]}, {"n": 53, "label": "linking 'r'", "segs": [{"t": "kw", "x": "Linking 'r'", "parts": [{"t": "blank", "a": "linking", "hint": false}, {"t": "given", "x": "'r'"}]}, {"t": "text", "x": " is the [ɹ] that non-rhotic accents pronounce when a word ending in a written r is followed by a vowel. In isolation, far is [fɑː], but in far away it is [fɑːɹəˈweɪ]; similarly, here is [hɪə], but here and there contains [ɹ]. Unlike intrusive 'r', linking 'r' corresponds to an r in the spelling and in the history of the word."}]}, {"n": 54, "label": "liquid", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "liquid", "parts": [{"t": "blank", "a": "liquid", "hint": false}]}, {"t": "text", "x": " is a consonant with relatively free airflow that is neither a nasal nor a glide. English has two liquids, the lateral /l/ (lip) and the rhotic /ɹ/ (rip). Liquids can be syllabic, as in bottle [ˈbɑɾl̩], and they are the most common second consonant in English onset clusters, as in play, black, tree, and cry."}]}, {"n": 55, "label": "manner of articulation (place of articulation)", "segs": [{"t": "kw", "x": "Manner of articulation", "parts": [{"t": "blank", "a": "manner", "hint": false}, {"t": "given", "x": "of"}, {"t": "given", "x": "articulation"}]}, {"t": "text", "x": " describes how the airflow is shaped: as a stop ([p]), fricative ([f]), affricate ([tʃ]), nasal ([m]), liquid ([l]), or glide ([w]). "}, {"t": "kw", "x": "Place of articulation", "parts": [{"t": "blank", "a": "place", "hint": false}, {"t": "given", "x": "of"}, {"t": "given", "x": "articulation"}]}, {"t": "text", "x": " describes where the constriction is made: bilabial ([p]), labio-dental ([f]), dental ([θ]), alveolar ([t]), palato-alveolar ([ʃ]), velar ([k]), or glottal ([h]). Together with voicing, these two dimensions describe every consonant; for example, [d] is a voiced alveolar stop."}]}, {"n": 56, "label": "metathesis", "segs": [{"t": "kw", "x": "Metathesis", "parts": [{"t": "blank", "a": "Metathesis", "hint": false}]}, {"t": "text", "x": " is the reversal of the order of two sounds. In the history of English, Old English brid became bird and hros became horse. Present-day examples include the nonstandard pronunciation of ask as [æks] and children's pasghetti for spaghetti. Metathesis often repairs a sequence that is hard to pronounce or to perceive."}]}, {"n": 57, "label": "minimal pair (near minimal pair)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "minimal pair", "parts": [{"t": "blank", "a": "minimal", "hint": false}, {"t": "given", "x": "pair"}]}, {"t": "text", "x": " is two words that differ in only one sound in the same position and have different meanings, such as pin /pɪn/ and bin /bɪn/, or ship and sheep. Minimal pairs show that two sounds are separate phonemes. When no perfect pair exists, a "}, {"t": "kw", "x": "near minimal pair", "parts": [{"t": "blank", "a": "near", "hint": true}, {"t": "blank", "a": "minimal", "hint": true}, {"t": "given", "x": "pair"}]}, {"t": "text", "x": " is used instead: pressure [ˈpɹɛʃɚ] and pleasure [ˈplɛʒɚ] differ in more than one sound but place /ʃ/ and /ʒ/ in nearly identical environments."}]}, {"n": 58, "label": "nasal (stop), nasalized vowel, nasalization", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "nasal stop", "parts": [{"t": "blank", "a": "nasal", "hint": false}, {"t": "given", "x": "stop"}]}, {"t": "text", "x": ", or simply a "}, {"t": "kw", "x": "nasal", "parts": [{"t": "blank", "a": "nasal", "hint": false}]}, {"t": "text", "x": ", is produced with a complete closure in the mouth while the velum is lowered, so that air escapes through the nose; English has /m/ (map), /n/ (nap), and /ŋ/ (sing). A "}, {"t": "kw", "x": "nasalized vowel", "parts": [{"t": "blank", "a": "nasalized", "hint": false}, {"t": "given", "x": "vowel"}]}, {"t": "text", "x": " is a vowel produced with air flowing through both the mouth and the nose, marked with a tilde, as in [ã]. In English, "}, {"t": "kw", "x": "nasalization", "parts": [{"t": "blank", "a": "nasalization", "hint": false}]}, {"t": "text", "x": " of a vowel before a nasal consonant is allophonic, as in can't [kæ̃nt], but in French it is phonemic: beau [bo] 'beautiful' versus bon [bɔ̃] 'good'."}]}, {"n": 59, "label": "natural class (naturalness)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "natural class", "parts": [{"t": "blank", "a": "natural", "hint": false}, {"t": "given", "x": "class"}]}, {"t": "text", "x": " is a group of sounds that share one or more features and can be described with fewer features than any single member. /p t k/ form a natural class (voiceless stops), but /p z ŋ/ do not. Phonological rules refer to natural classes: English aspiration affects all voiceless stops, not just one. "}, {"t": "kw", "x": "Naturalness", "parts": [{"t": "blank", "a": "Naturalness", "hint": false}]}, {"t": "text", "x": " also describes how phonetically plausible a rule is; voicing assimilation is natural, whereas a rule turning /k/ into [m] would not be."}]}, {"n": 60, "label": "neutralization, neutralized", "segs": [{"t": "kw", "x": "Neutralization", "parts": [{"t": "blank", "a": "Neutralization", "hint": false}]}, {"t": "text", "x": " occurs when a phonemic contrast is lost in a particular environment. In American English, /t/ and /d/ contrast in tie and die but are "}, {"t": "kw", "x": "neutralized", "parts": [{"t": "blank", "a": "neutralized", "hint": false}]}, {"t": "text", "x": " as a flap [ɾ] between vowels, so writer and rider can sound the same. In German, the voicing contrast is neutralized word-finally, so Rad 'wheel' and Rat 'advice' are both pronounced [ʁaːt]."}]}, {"n": 61, "label": "node", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "node", "parts": [{"t": "blank", "a": "node", "hint": false}]}, {"t": "text", "x": " is a point in a hierarchical tree representation. In syllable structure, the syllable node (σ) branches into the onset and the rhyme, and the rhyme node branches into the nucleus and the coda. In feature geometry, features are grouped under class nodes such as the Laryngeal node ([voice]) and the Place node ([labial], [coronal], [dorsal]), so that spreading one node in place assimilation moves all of its features at once."}]}, {"n": 62, "label": "nucleus", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "nucleus", "parts": [{"t": "blank", "a": "nucleus", "hint": false}]}, {"t": "text", "x": " is the obligatory core of a syllable, usually a vowel. In cat the nucleus is [æ], and in boy it is the diphthong [ɔɪ]. When there is no vowel, a syllabic sonorant can serve as the nucleus, as [n̩] in button [ˈbʌʔ.n̩] and [l̩] in bottle. Obstruents cannot be nuclei in English, which is why *[bkt] is not a possible word."}]}, {"n": 63, "label": "obstruent", "segs": [{"t": "text", "x": "An "}, {"t": "kw", "x": "obstruent", "parts": [{"t": "blank", "a": "obstruent", "hint": false}]}, {"t": "text", "x": " is a consonant produced with a constriction that blocks or greatly restricts the airflow, so that air pressure builds up in the mouth. Obstruents include stops (/p b t d k g/), fricatives (/f v θ ð s z ʃ ʒ h/), and affricates (/tʃ dʒ/). Unlike sonorants, obstruents contrast in voicing, and English requires two obstruents in the same coda to agree in voicing, as in kept [pt] and begged [gd]."}]}, {"n": 64, "label": "onset", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "onset", "parts": [{"t": "blank", "a": "onset", "hint": false}]}, {"t": "text", "x": " is the part of a syllable that comes before the nucleus. In pet the onset is /p/, in street it is /stɹ/, and in eat there is no onset. Languages prefer onsets to codas, so a consonant between vowels is syllabified as an onset where possible (ho.tel rather than *hot.el). English onsets cannot contain /ŋ/, and a complex onset cannot begin with an affricate."}]}, {"n": 65, "label": "opacity (opaque)", "segs": [{"t": "kw", "x": "Opacity", "parts": [{"t": "blank", "a": "Opacity", "hint": false}]}, {"t": "text", "x": " arises when the effect of a rule is hidden on the surface, or when a rule has applied even though its conditioning environment is no longer visible. In Canadian English, writer [ˈɹʌɪɾɚ] has a raised diphthong before a flap, although raising applies only before voiceless consonants; the conditioning /t/ has since become a voiced flap. This interaction is "}, {"t": "kw", "x": "opaque", "parts": [{"t": "blank", "a": "opaque", "hint": false}]}, {"t": "text", "x": " and requires raising to apply before flapping."}]}, {"n": 66, "label": "oral tract", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "oral tract", "parts": [{"t": "blank", "a": "oral", "hint": false}, {"t": "given", "x": "tract"}]}, {"t": "text", "x": " is the part of the vocal tract inside the mouth, from the lips back to the pharynx. Most speech sounds are shaped by constrictions in the oral tract made by the lips, tongue, teeth, and palate. When the velum is raised, air flows only through the oral tract, producing oral sounds such as [b] and [a]; when it is lowered, air also enters the nasal tract, producing [m] or [ã]."}]}, {"n": 67, "label": "palatal", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "palatal", "parts": [{"t": "blank", "a": "palatal", "hint": false}]}, {"t": "text", "x": " sound is made with the front of the tongue raised toward the hard palate. The English glide /j/ in yes is palatal. Other languages have palatal stops and nasals, such as Spanish ñ [ɲ] in año 'year' and Hungarian ty [c]. English /k/ moves forward toward the palatal region before front vowels, as in key compared with coo."}]}, {"n": 68, "label": "palato-alveolar", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "palato-alveolar", "parts": [{"t": "blank", "a": "palato-alveolar", "hint": false}]}, {"t": "text", "x": " sound is made with the tongue blade against the back of the alveolar ridge while the front of the tongue is raised toward the hard palate. English palato-alveolars are the fricatives /ʃ/ (shoe) and /ʒ/ (measure) and the affricates /tʃ/ (church) and /dʒ/ (judge). They are often produced with lip rounding as a secondary articulation."}]}, {"n": 69, "label": "post-alveolar", "segs": [{"t": "kw", "x": "Post-alveolar", "parts": [{"t": "blank", "a": "Post-alveolar", "hint": false}]}, {"t": "text", "x": " is a cover term for sounds made just behind the alveolar ridge. It includes the palato-alveolar consonants /ʃ ʒ tʃ dʒ/ and the English approximant /ɹ/ in red, which is post-alveolar or retroflex for many speakers. The IPA chart lists /ʃ ʒ/ in the post-alveolar column, so palato-alveolar and post-alveolar are often used interchangeably for English."}]}, {"n": 70, "label": "phoneme", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "phoneme", "parts": [{"t": "blank", "a": "phoneme", "hint": false}]}, {"t": "text", "x": " is the smallest unit of sound that can distinguish meaning in a language. English /p/ and /b/ are separate phonemes because pat and bat mean different things. A phoneme is an abstract category realized by one or more allophones: /t/ appears as [tʰ] in top, [t] in stop, and [ɾ] in city. Phonemes are written between slashes."}]}, {"n": 71, "label": "phonetic form", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "phonetic form", "parts": [{"t": "blank", "a": "phonetic", "hint": false}, {"t": "given", "x": "form"}]}, {"t": "text", "x": " is the actual pronunciation of an utterance, including predictable details such as aspiration, vowel length, and flapping. Writer has the phonemic form /ˈɹaɪtɚ/ but the phonetic form [ˈɹʌɪɾɚ] in Canadian English. In generative grammar, Phonetic Form (PF) is also the level of representation that connects grammar to articulation and perception."}]}, {"n": 72, "label": "phonetics vs. phonology", "segs": [{"t": "kw", "x": "Phonetics", "parts": [{"t": "blank", "a": "Phonetics", "hint": false}]}, {"t": "text", "x": " studies the physical properties of speech sounds: how they are produced, transmitted, and perceived. "}, {"t": "kw", "x": "Phonology", "parts": [{"t": "blank", "a": "Phonology", "hint": false}]}, {"t": "text", "x": " studies how sounds function in a particular language: which sounds contrast, how they combine, and what patterns they follow. Phonetics measures the puff of air in [pʰ]; phonology explains that aspiration is predictable in English and does not distinguish words, whereas in Korean it does."}]}, {"n": 73, "label": "phonotactics", "segs": [{"t": "kw", "x": "Phonotactics", "parts": [{"t": "blank", "a": "Phonotactics", "hint": false}]}, {"t": "text", "x": " is the set of constraints on the possible combinations and positions of sounds in a language. English allows /bl/ at the beginning of a word (blick) but not /bn/ (*bnick), and it allows /ŋ/ at the end of a syllable (sing) but not at the beginning. Native speakers know these constraints implicitly, so they judge blick as a possible English word and bnick as impossible."}]}, {"n": 74, "label": "plosive (~stop)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "plosive", "parts": [{"t": "blank", "a": "plosive", "hint": false}]}, {"t": "text", "x": " is an oral "}, {"t": "kw", "x": "stop", "parts": [{"t": "blank", "a": "stop", "hint": false}]}, {"t": "text", "x": ": a consonant made by completely closing the vocal tract, building up air pressure, and releasing it in a burst. English plosives are /p b/ (bilabial), /t d/ (alveolar), and /k g/ (velar), as in pat, bad, and kick. The term stop is broader, because it can also include nasal stops such as [m], in which air escapes through the nose during the closure."}]}, {"n": 75, "label": "plural formation", "segs": [{"t": "text", "x": "Regular English "}, {"t": "kw", "x": "plural formation", "parts": [{"t": "blank", "a": "plural", "hint": false}, {"t": "given", "x": "formation"}]}, {"t": "text", "x": " shows a three-way alternation conditioned by the last sound of the noun: [ɪz] after sibilants (buses, judges), [s] after other voiceless sounds (cats, cliffs), and [z] after other voiced sounds, including vowels (dogs, bees). The usual analysis posits an underlying /z/ with two rules, vowel epenthesis and voicing assimilation, ordered so that epenthesis applies first."}]}, {"n": 76, "label": "post-lexical rule", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "post-lexical rule", "parts": [{"t": "blank", "a": "post-lexical", "hint": false}, {"t": "given", "x": "rule"}]}, {"t": "text", "x": ", in Lexical Phonology, applies after words have been combined into phrases, so it can operate across word boundaries. Post-lexical rules have no exceptions, ignore morphological structure, and may create allophones. American English flapping is post-lexical: it applies within words (water) and across words (get it [ɡɛɾɪt]) regardless of morphology."}]}, {"n": 77, "label": "rhotic (rhoticisation, rhoticised vowels)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "rhotic", "parts": [{"t": "blank", "a": "rhotic", "hint": false}]}, {"t": "text", "x": " is an r-sound, such as the English approximant [ɹ], the Spanish trill [r], or the tap [ɾ]. An accent is called rhotic when it pronounces /r/ after vowels, as in General American car [kɑɹ], and non-rhotic when it does not, as in RP car [kɑː]. "}, {"t": "kw", "x": "Rhoticisation", "parts": [{"t": "blank", "a": "Rhoticisation", "hint": false}]}, {"t": "text", "x": " gives a vowel an r-coloring, producing "}, {"t": "kw", "x": "rhoticised vowels", "parts": [{"t": "blank", "a": "rhoticised", "hint": false}, {"t": "given", "x": "vowels"}]}, {"t": "text", "x": " such as [ɚ] in butter and [ɝ] in bird."}]}, {"n": 78, "label": "rhyme", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "rhyme", "parts": [{"t": "blank", "a": "rhyme", "hint": false}]}, {"t": "text", "x": " (also spelled rime) is the part of a syllable made up of the nucleus and the coda. In cat, the onset is /k/ and the rhyme is /æt/; words that rhyme in poetry, such as cat, hat, and flat, share the same rhyme. The rhyme determines syllable weight, and many constraints apply within it, such as the requirement that a stressed lax vowel be followed by a coda."}]}, {"n": 79, "label": "rounding (lip rounding)", "segs": [{"t": "kw", "x": "Rounding", "parts": [{"t": "blank", "a": "Rounding", "hint": false}]}, {"t": "text", "x": ", or "}, {"t": "kw", "x": "lip rounding", "parts": [{"t": "given", "x": "lip"}, {"t": "blank", "a": "rounding", "hint": false}]}, {"t": "text", "x": ", is the protrusion and narrowing of the lips during the production of a sound. In English, back vowels are usually rounded ([u] in boot, [ɔ] in thought), while front vowels are unrounded. French and German also have front rounded vowels, such as [y] in French tu 'you'. Consonants may be rounded in anticipation of a rounded vowel or glide, as [kʷ] in queen and [tʷ] in two."}]}, {"n": 80, "label": "rule ordering (extrinsic vs. intrinsic order)", "segs": [{"t": "kw", "x": "Rule ordering", "parts": [{"t": "blank", "a": "rule", "hint": true}, {"t": "blank", "a": "ordering", "hint": true}]}, {"t": "text", "x": " is the sequence in which phonological rules apply in a derivation. "}, {"t": "kw", "x": "Extrinsic order", "parts": [{"t": "blank", "a": "extrinsic", "hint": false}, {"t": "given", "x": "order"}]}, {"t": "text", "x": " must be stated in the grammar: in Canadian English, raising must apply before flapping to derive writer [ˈɹʌɪɾɚ] versus rider [ˈɹaɪɾɚ]. "}, {"t": "kw", "x": "Intrinsic order", "parts": [{"t": "blank", "a": "intrinsic", "hint": false}, {"t": "given", "x": "order"}]}, {"t": "text", "x": " follows from the form of the rules themselves, so it need not be stated: if one rule creates the only environment in which another can apply, the first must come before the second."}]}, {"n": 81, "label": "schwa", "segs": [{"t": "kw", "x": "Schwa", "parts": [{"t": "blank", "a": "Schwa", "hint": false}]}, {"t": "text", "x": " [ə] is a mid central vowel and the most common vowel in English. It occurs only in unstressed syllables, as in about [əˈbaʊt], sofa [ˈsoʊfə], and the second syllable of photograph. Many full vowels reduce to schwa when they lose stress: compare photograph [ˈfoʊtəɡɹæf] with photography [fəˈtɑɡɹəfi]."}]}, {"n": 82, "label": "semi-vowel", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "semi-vowel", "parts": [{"t": "blank", "a": "semi-vowel", "hint": false}]}, {"t": "text", "x": " is another name for a glide, a sound that is phonetically similar to a vowel but functions as a consonant at the edge of a syllable. English /j/ in yet corresponds to the vowel [i], and /w/ in wet corresponds to [u]. Semi-vowels are non-syllabic, so yes has one syllable, and they pattern with consonants: we say a yacht, not *an yacht."}]}, {"n": 83, "label": "sibilants (~stridents)", "segs": [{"t": "kw", "x": "Sibilants", "parts": [{"t": "blank", "a": "Sibilants", "hint": false}]}, {"t": "text", "x": " are fricatives and affricates with a high-pitched hissing or hushing noise, produced by directing the airstream against the teeth: /s z ʃ ʒ tʃ dʒ/. In feature terms they are [+strident], so they are also called "}, {"t": "kw", "x": "stridents", "parts": [{"t": "blank", "a": "stridents", "hint": false}]}, {"t": "text", "x": ", although some analyses also count /f v/ as strident. The English plural, possessive, and third-person suffixes add [ɪz] after sibilants, as in buses, judges, and wishes."}]}, {"n": 84, "label": "sonorant (sonority, sonority hierarchy)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "sonorant", "parts": [{"t": "blank", "a": "sonorant", "hint": false}]}, {"t": "text", "x": " is a sound produced with relatively free airflow and spontaneous voicing: vowels, glides, liquids, and nasals. "}, {"t": "kw", "x": "Sonority", "parts": [{"t": "blank", "a": "Sonority", "hint": false}]}, {"t": "text", "x": " is a sound's relative loudness or resonance, and the "}, {"t": "kw", "x": "sonority hierarchy", "parts": [{"t": "blank", "a": "sonority", "hint": true}, {"t": "blank", "a": "hierarchy", "hint": true}]}, {"t": "text", "x": " ranks sounds as vowels > glides > liquids > nasals > fricatives > stops. Syllables tend to rise in sonority toward the nucleus and fall after it, so English allows /pl/ in onsets (play) and /lp/ in codas (help), but not the reverse."}]}, {"n": 85, "label": "spoonerism", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "spoonerism", "parts": [{"t": "blank", "a": "spoonerism", "hint": false}]}, {"t": "text", "x": " is a speech error in which sounds, usually the initial consonants, of two words are exchanged, as in a well-boiled icicle for a well-oiled bicycle, or you have hissed all my mystery lectures for you have missed all my history lectures. Named after the Reverend William Spooner, spoonerisms show that speakers plan speech in units such as phonemes and onsets."}]}, {"n": 86, "label": "spreading (feature spreading)", "segs": [{"t": "kw", "x": "Spreading", "parts": [{"t": "blank", "a": "Spreading", "hint": false}]}, {"t": "text", "x": ", or "}, {"t": "kw", "x": "feature spreading", "parts": [{"t": "given", "x": "feature"}, {"t": "blank", "a": "spreading", "hint": false}]}, {"t": "text", "x": ", is the extension of a feature from one segment to a neighboring segment, the mechanism behind most assimilation. In autosegmental notation, an association line links the feature to the adjacent segment as well. When the place feature of /p/ spreads to the preceding nasal in in- + possible, the result is impossible [ɪm-]; nasality also spreads from a nasal consonant to a neighboring vowel, as in man [mæ̃n]."}]}, {"n": 87, "label": "palatalization (palatalized)", "segs": [{"t": "kw", "x": "Palatalization", "parts": [{"t": "blank", "a": "Palatalization", "hint": false}]}, {"t": "text", "x": " is a process in which a consonant moves toward the palatal region or acquires a secondary palatal articulation, usually before a front vowel or /j/. In English, /t d s z/ + /j/ become palato-alveolar across word boundaries: did you [dɪdʒu] and miss you [mɪʃu]. A "}, {"t": "kw", "x": "palatalized", "parts": [{"t": "blank", "a": "palatalized", "hint": false}]}, {"t": "text", "x": " consonant, such as Russian [tʲ], has a raised tongue body added to its primary articulation."}]}, {"n": 88, "label": "stress (function, primary, secondary, placement)", "segs": [{"t": "kw", "x": "Stress", "parts": [{"t": "blank", "a": "Stress", "hint": false}]}, {"t": "text", "x": " is the relative prominence of a syllable, signaled by greater length, loudness, pitch movement, and full vowel quality. A word has one "}, {"t": "kw", "x": "primary", "parts": [{"t": "blank", "a": "primary", "hint": false}]}, {"t": "text", "x": " stress and may have "}, {"t": "kw", "x": "secondary", "parts": [{"t": "blank", "a": "secondary", "hint": false}]}, {"t": "text", "x": " stress: in conversation, -sa- carries primary stress and con- carries secondary stress. Stress has a contrastive "}, {"t": "kw", "x": "function", "parts": [{"t": "blank", "a": "function", "hint": false}]}, {"t": "text", "x": " in English, distinguishing the noun RECord from the verb reCORD. Its "}, {"t": "kw", "x": "placement", "parts": [{"t": "blank", "a": "placement", "hint": false}]}, {"t": "text", "x": " depends on syllable weight, word class, and affixes, as in PHOtograph, phoTOgraphy, and photoGRAphic."}]}, {"n": 89, "label": "superscript (subscript, diacritic)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "diacritic", "parts": [{"t": "blank", "a": "diacritic", "hint": false}]}, {"t": "text", "x": " is a small mark added to an IPA symbol to modify its value. A "}, {"t": "kw", "x": "superscript", "parts": [{"t": "blank", "a": "superscript", "hint": false}]}, {"t": "text", "x": " diacritic is written raised beside the symbol, such as [ʰ] for aspiration in [pʰ] or [ʷ] for rounding in [kʷ]. A "}, {"t": "kw", "x": "subscript", "parts": [{"t": "blank", "a": "subscript", "hint": false}]}, {"t": "text", "x": " diacritic is written below it, such as [ ̥ ] for devoicing in [l̥], [ ̩ ] for a syllabic consonant in [n̩], and [ ̪ ] for dental articulation in [t̪]."}]}, {"n": 90, "label": "suppletion", "segs": [{"t": "kw", "x": "Suppletion", "parts": [{"t": "blank", "a": "Suppletion", "hint": false}]}, {"t": "text", "x": " is the use of an entirely different root to express a grammatical form of a word, instead of a regular affix or alternation. English go has the suppletive past went, good has better and best, and be has am, is, are, was, and were. Suppletive forms cannot be derived by phonological rules and must be listed in the lexicon."}]}, {"n": 91, "label": "syllabic (syllabicity)", "segs": [{"t": "text", "x": "A segment is "}, {"t": "kw", "x": "syllabic", "parts": [{"t": "blank", "a": "syllabic", "hint": false}]}, {"t": "text", "x": " when it forms the nucleus of a syllable. Vowels are normally syllabic, but sonorant consonants can also be syllabic in unstressed syllables, as [n̩] in button and [l̩] in bottle, marked with the subscript [ ̩ ]. "}, {"t": "kw", "x": "Syllabicity", "parts": [{"t": "blank", "a": "Syllabicity", "hint": false}]}, {"t": "text", "x": " is captured by the feature [±syllabic], which distinguishes vowels from glides: [i] is [+syllabic], whereas [j] is [−syllabic]."}]}, {"n": 92, "label": "synchrony vs. diachrony", "segs": [{"t": "kw", "x": "Synchrony", "parts": [{"t": "blank", "a": "Synchrony", "hint": false}]}, {"t": "text", "x": " is the study of a language as a system at one particular point in time, whereas "}, {"t": "kw", "x": "diachrony", "parts": [{"t": "blank", "a": "diachrony", "hint": false}]}, {"t": "text", "x": " is the study of how it changes over time. A synchronic analysis explains the alternation in divine and divinity with a present-day rule of vowel shortening; a diachronic analysis traces it to the Great Vowel Shift, which changed the long vowel of divine but not the short vowel of divinity. Ferdinand de Saussure introduced the distinction."}]}, {"n": 93, "label": "unreleased (stop); unexploded", "segs": [{"t": "text", "x": "An "}, {"t": "kw", "x": "unreleased stop", "parts": [{"t": "blank", "a": "unreleased", "hint": false}, {"t": "given", "x": "stop"}]}, {"t": "text", "x": " is a stop whose closure is not followed by an audible burst, marked with the diacritic [ ̚ ]. In English, stops are often unreleased at the end of a word or before another stop, as in cat [kʰæt̚] and apt [æp̚t]. Such stops are also described as "}, {"t": "kw", "x": "unexploded", "parts": [{"t": "blank", "a": "unexploded", "hint": false}]}, {"t": "text", "x": ". In Korean, syllable-final stops are always unreleased, as in [pap̚] 'rice'."}]}, {"n": 94, "label": "velar (velum, velarization)", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "velum", "parts": [{"t": "blank", "a": "velum", "hint": false}]}, {"t": "text", "x": " is the soft palate at the back of the roof of the mouth. A "}, {"t": "kw", "x": "velar", "parts": [{"t": "blank", "a": "velar", "hint": false}]}, {"t": "text", "x": " consonant is made by raising the back of the tongue against the velum: English /k/ (cat), /g/ (go), and /ŋ/ (sing). "}, {"t": "kw", "x": "Velarization", "parts": [{"t": "blank", "a": "Velarization", "hint": false}]}, {"t": "text", "x": " is a secondary articulation in which the back of the tongue is raised toward the velum during another sound, as in English dark [ɫ] in feel. Lowering the velum opens the nasal passage for nasal sounds."}]}, {"n": 95, "label": "vocal tract", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "vocal tract", "parts": [{"t": "blank", "a": "vocal", "hint": false}, {"t": "given", "x": "tract"}]}, {"t": "text", "x": " is the passage above the larynx through which air flows during speech. It includes the pharynx, the oral cavity, and the nasal cavity. Changing the shape of the vocal tract with the tongue, lips, jaw, and velum produces different sounds: a narrow constriction between the lower lip and upper teeth gives [f], and a lowered velum adds nasal resonance, as in [m]."}]}, {"n": 96, "label": "voiced (voiceless, voicing, vocal cords = vocal folds)", "segs": [{"t": "text", "x": "A sound is "}, {"t": "kw", "x": "voiced", "parts": [{"t": "blank", "a": "voiced", "hint": false}]}, {"t": "text", "x": " when the "}, {"t": "kw", "x": "vocal cords", "parts": [{"t": "given", "x": "vocal"}, {"t": "blank", "a": "cords", "hint": false}]}, {"t": "text", "x": ", also called the "}, {"t": "kw", "x": "vocal folds", "parts": [{"t": "given", "x": "vocal"}, {"t": "blank", "a": "folds", "hint": false}]}, {"t": "text", "x": ", vibrate during its production, as in [b d g v z m], and "}, {"t": "kw", "x": "voiceless", "parts": [{"t": "blank", "a": "voiceless", "hint": false}]}, {"t": "text", "x": " when they do not, as in [p t k f s]. You can feel "}, {"t": "kw", "x": "voicing", "parts": [{"t": "blank", "a": "voicing", "hint": false}]}, {"t": "text", "x": " by touching your throat while saying zzz and then sss. Voicing distinguishes many English minimal pairs, such as pat and bat or fan and van."}]}, {"n": 97, "label": "voice onset time (VOT)", "segs": [{"t": "kw", "x": "Voice onset time (VOT)", "parts": [{"t": "blank", "a": "voice", "hint": true}, {"t": "blank", "a": "onset", "hint": true}, {"t": "blank", "a": "time", "hint": true}]}, {"t": "text", "x": " is the interval between the release of a stop and the beginning of vocal fold vibration. English word-initial /p t k/ have a long positive VOT (aspiration), while /b d g/ have a VOT close to zero. In French and Spanish, voiced stops have a negative VOT because voicing starts before the release. Korean distinguishes three stop types partly by VOT: [pul] 'fire', [pʰul] 'grass', and [p͈ul] 'horn'."}]}, {"n": 98, "label": "vowel (height, backness, reduction)", "segs": [{"t": "text", "x": "A "}, {"t": "kw", "x": "vowel", "parts": [{"t": "blank", "a": "vowel", "hint": false}]}, {"t": "text", "x": " is a sound produced without significant obstruction in the vocal tract that usually forms the nucleus of a syllable. Vowels are classified by "}, {"t": "kw", "x": "height", "parts": [{"t": "blank", "a": "height", "hint": false}]}, {"t": "text", "x": " (high [i u], mid [e o], low [æ ɑ]), "}, {"t": "kw", "x": "backness", "parts": [{"t": "blank", "a": "backness", "hint": false}]}, {"t": "text", "x": " (front [i e æ], central [ə], back [u o ɑ]), and lip rounding. Vowel "}, {"t": "kw", "x": "reduction", "parts": [{"t": "blank", "a": "reduction", "hint": false}]}, {"t": "text", "x": " weakens unstressed vowels toward schwa, as in the second syllable of photograph [ˈfoʊtəɡɹæf] compared with photography [fəˈtɑɡɹəfi]."}]}, {"n": 99, "label": "Great Vowel Shift", "segs": [{"t": "text", "x": "The "}, {"t": "kw", "x": "Great Vowel Shift", "parts": [{"t": "blank", "a": "great", "hint": true}, {"t": "blank", "a": "vowel", "hint": true}, {"t": "blank", "a": "shift", "hint": true}]}, {"t": "text", "x": " was a series of changes in the English long vowels between about 1400 and 1700. Long vowels were raised one step, and the highest vowels became diphthongs: Middle English /iː/ in time became /aɪ/, /uː/ in house became /aʊ/, /eː/ in see became /iː/, and /aː/ in name eventually became /eɪ/. Because English spelling was largely fixed before the shift was complete, the letters of these words no longer match their sounds."}]}];
const CONFIG = /*__CONFIG__*/{"mode": "flash", "order": []};
const byN = Object.fromEntries(TERMS.map(t => [t.n, t]));
const st = { mode: CONFIG.mode, deck: CONFIG.order.map(n => byN[n]).filter(Boolean), i: 0, flipped: false, answers: {}, checkedCards: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
// ---------- answer checking ----------
function norm(s) {
  return String(s || "").toLowerCase().trim()
    .replace(/[’`]/g, "'").replace(/[\s\-]+/g, "")
    .replace(/isation/g, "ization").replace(/ised/g, "ized").replace(/ise\b/g, "ize");
}
function same(given, answer) {
  const g = norm(given), a = norm(answer);
  if (!g) return false;
  return g === a || g + "s" === a || g === a + "s" || g + "es" === a || g === a + "es";
}

// ---------- rendering ----------
function maskRegex(term) {
  // Hide other mentions of the answer words in the paragraph, except very common words.
  const STOP = new Set(["free","true","fake","open","closed","light","heavy","near","place","manner","class","great","vowel","shift",
    "voice","time","levels","dual","binary","unary","major","tense","clear","dark","default","oral","vocal","plural","natural",
    "surface","rule","feature","primary","secondary","function","placement","stop","condition","representation","international"]);
  const words = [];
  term.segs.forEach(s => {
    if (s.t !== "kw") return;
    s.parts.forEach(p => { if (p.t === "blank" && p.a.length >= 4 && !STOP.has(p.a.toLowerCase())) words.push(p.a); });
  });
  if (!words.length) return null;
  const alt = words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return new RegExp(`\\b(${alt})(s|es)?\\b`, "gi");
}

function flashText(term) {
  return term.segs.map(s => s.t === "kw" ? `<mark>${esc(s.x)}</mark>` : esc(s.x)).join("");
}

function quizText(term, key) {
  const rx = maskRegex(term);
  let b = 0;
  const done = st.checkedCards[key];
  return term.segs.map(s => {
    if (s.t === "text") {
      const t = esc(s.x);
      return rx ? t.replace(rx, `<span class="masked" title="hidden"></span>`) : t;
    }
    const nBlanks = s.parts.filter(p => p.t === "blank").length;
    let h = `<span class="kw">`;
    s.parts.forEach((p, idx) => {
      if (idx) h += " ";
      if (p.t === "given") { h += `<span class="given">${esc(p.x)}</span>`; return; }
      const id = `${key}-${b++}`;
      const val = st.answers[id] || "";
      const size = Math.max(5, p.a.length + 1);
      const ph = p.hint ? `${p.a[0].toLowerCase()}…` : "";
      let cls = "";
      if (done) cls = same(val, p.a) ? "ok" : "bad";
      h += `<input type="text" data-id="${id}" data-a="${esc(p.a)}" size="${size}" placeholder="${esc(ph)}" value="${esc(val)}" class="${cls}" aria-label="Blank" autocomplete="off" autocapitalize="off" spellcheck="false">`;
      if (done && cls === "bad") h += `<span class="fix">(${esc(p.a.toLowerCase())})</span>`;
    });
    if (nBlanks >= 2) h += `<span class="words">${nBlanks} words</span>`;
    return h + `</span>`;
  }).join("");
}

function renderStage() {
  const stage = $("stage");
  if (!st.mode) { stage.innerHTML = ""; return; }
  if (!st.deck.length) { stage.innerHTML = `<p class="empty">No terms selected yet. Choose terms in the <strong>Select terms</strong> tab.</p>`; return; }
  const term = st.deck[st.i];
  const key = `t${term.n}`;
  const pos = `${st.i + 1} / ${st.deck.length}`;
  let h = `<div class="card"><div class="card-top"><span>${st.mode === "flash" ? "Flashcard" : "Quiz"} · ${pos}</span><span>Term ${term.n}</span></div>`;
  if (st.mode === "flash") {
    h += `<div class="front">${esc(term.label)}</div>`;
    h += `<div class="text">${flashText(term)}</div>`;
    h += `<div class="nav">`;
  } else {
    h += `<div class="text">${quizText(term, key)}</div>`;
    const res = st.checkedCards[key];
    if (res) h += `<div class="result ${res.ok === res.total ? "ok" : "bad"}">${res.ok} of ${res.total} correct${res.ok === res.total ? " — well done!" : ". Corrections are shown in red."}</div>`;
    h += `<div class="nav"><button type="button" class="btn primary" id="check">Check answers</button>`;
    h += `<button type="button" class="btn small" id="retry">Try again</button>`;
  }
  h += `<button type="button" class="btn small" id="prev" ${st.i === 0 ? "disabled" : ""}>← Previous</button>`;
  h += `<button type="button" class="btn small" id="next" ${st.i === st.deck.length - 1 ? "disabled" : ""}>Next →</button></div></div>`;
  stage.innerHTML = h;

  if (st.mode === "flash") {
    // explanation is always shown
  } else {
    stage.querySelectorAll("input[data-id]").forEach(inp => {
      inp.addEventListener("input", () => { st.answers[inp.dataset.id] = inp.value; });
      inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(key); } });
    });
    $("check").addEventListener("click", () => check(key));
    $("retry").addEventListener("click", () => {
      delete st.checkedCards[key];
      Object.keys(st.answers).filter(k => k.startsWith(key + "-")).forEach(k => delete st.answers[k]);
      renderStage();
    });
    const first = stage.querySelector("input[data-id]");
    if (first && !st.checkedCards[key]) first.focus({ preventScroll: true });
  }
  $("prev").addEventListener("click", () => { st.i--; st.flipped = false; renderStage(); });
  $("next").addEventListener("click", () => { st.i++; st.flipped = false; renderStage(); });
}

function check(key) {
  const inputs = [...document.querySelectorAll("#stage input[data-id]")];
  inputs.forEach(inp => { st.answers[inp.dataset.id] = inp.value; });
  const ok = inputs.filter(inp => same(inp.value, inp.dataset.a)).length;
  st.checkedCards[key] = { ok, total: inputs.length };
  renderStage();
}


renderStage();
</script>
